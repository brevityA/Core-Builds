<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-src 'none'; object-src 'none'; worker-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Never set up a Stremio addon before? Answer three questions and follow your own step-by-step setup for Stremio, Nuvio, WuPlay or Chillio, in English, Español, Português, Français or Deutsch.">
<title>Start Here · Core Builds</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpath d='M22 4 39 14v16L22 40 5 30V14Z' fill='none' stroke='%2300d4ff' stroke-width='2'/%3E%3Cpath d='m22 13 9 9-9 9-9-9Z' fill='%2300d4ff' opacity='.5'/%3E%3C/svg%3E">
<style>
/* The Quick install panel: one centred column, mono STEP labels, choice tiles. The three answers at the top tailor every step below. */
:root{
  --bg:#070b10; --panel1:#131d29; --panel2:#0c131c; --panel-line:rgba(0,212,255,.24);
  --tile:#0e1621; --tile-line:rgba(255,255,255,.09); --field:#0a121b;
  --fg:#edf4f8; --tx2:#a9b6c4; --muted:#8693a3; --label:#6f7f92;
  --accent:#00d4ff; --accent-ink:#67e8f9; --accent-soft:rgba(0,212,255,.1); --accent-line:rgba(0,212,255,.3); --on-accent:#04202b;
  --good:#4ade80; --good-soft:rgba(74,222,128,.08); --good-line:rgba(74,222,128,.3);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.07); --warn-line:rgba(251,191,36,.3);
  --shadow:0 30px 100px rgba(0,0,0,.55); --bar:rgba(7,11,16,.88);
  --serif:Georgia,'Times New Roman',serif; --body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2f6; --panel1:#ffffff; --panel2:#ffffff; --panel-line:#cfd8e2;
  --tile:#f6f8fa; --tile-line:#d7dee5; --field:#ffffff;
  --fg:#1c252d; --tx2:#44515e; --muted:#5f6c78; --label:#64717f;
  --accent:#0891b2; --accent-ink:#0e7490; --accent-soft:#e3f6fb; --accent-line:#8fd3e6; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#eaf8f0; --good-line:#a6dcbb;
  --warn:#a15c00; --warn-soft:#fff6e5; --warn-line:#f0c879;
  --shadow:0 28px 80px rgba(32,48,64,.16); --bar:rgba(238,242,246,.9); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2f6; --panel1:#ffffff; --panel2:#ffffff; --panel-line:#cfd8e2;
  --tile:#f6f8fa; --tile-line:#d7dee5; --field:#ffffff;
  --fg:#1c252d; --tx2:#44515e; --muted:#5f6c78; --label:#64717f;
  --accent:#0891b2; --accent-ink:#0e7490; --accent-soft:#e3f6fb; --accent-line:#8fd3e6; --on-accent:#ffffff;
  --good:#15803d; --good-soft:#eaf8f0; --good-line:#a6dcbb;
  --warn:#a15c00; --warn-soft:#fff6e5; --warn-line:#f0c879;
  --shadow:0 28px 80px rgba(32,48,64,.16); --bar:rgba(238,242,246,.9); color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--accent-ink)}
.skip{position:absolute;left:-999px;top:8px;padding:8px 12px;background:var(--accent);color:var(--on-accent);border-radius:8px;z-index:50}
.skip:focus{left:12px}
/* Sticky progress bar with the language picker */
.top{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--tile-line);padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.prog span{font-size:.78rem;font-weight:700;color:var(--tx2);white-space:nowrap}
.bar{flex:1;height:6px;border-radius:99px;background:var(--tile-line);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#00abd3,var(--accent));transition:width .3s}
.top button{all:unset;cursor:pointer;font-size:.74rem;font-weight:700;color:var(--muted);white-space:nowrap}
.top button:hover{color:var(--fg)}
.top button:focus-visible,.lang-menu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.lang{position:relative}
.lang-btn{display:inline-flex!important;align-items:center;gap:5px;padding:4px 8px!important;border:1px solid var(--tile-line)!important;border-radius:8px!important;letter-spacing:.04em}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:150px;display:flex;flex-direction:column;padding:4px;background:var(--panel1);border:1px solid var(--tile-line);border-radius:10px;box-shadow:var(--shadow)}
.lang-menu[hidden]{display:none}
.lang-menu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:.85rem;color:var(--tx2)}
.lang-menu button:hover{background:var(--accent-soft);color:var(--fg)}
.lang-menu button[aria-checked="true"]{color:var(--accent-ink);font-weight:700}
.lang-menu button[aria-checked="true"]::after{content:" ✓"}
/* Panel */
.page{padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{max-width:660px;margin:0 auto;background:linear-gradient(155deg,var(--panel1),var(--panel2));border:1px solid var(--panel-line);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow)}
.head{text-align:center}
.head svg{display:block;margin:0 auto 8px}
.kicker{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-family:var(--serif);font-size:1.9rem;letter-spacing:-.035em;margin:2px 0 4px;font-weight:700}
h1 span{color:var(--accent)}
.intro{color:var(--muted);font-size:.88rem;max-width:48ch;margin:0 auto}
.sec{margin-top:26px;padding-top:22px;border-top:1px solid var(--tile-line);transition:opacity .2s}
.sec.locked{opacity:.4;pointer-events:none}
.lbl{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:9px;margin-bottom:4px}
.lbl .num{font:800 .66rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.lbl em{font:700 1rem/1.3 var(--body);font-style:normal;color:var(--fg)}
.lbl .ok{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.04em;color:var(--good)}
.why{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.why strong,.tasks strong,.note strong,.done-card strong{color:var(--fg);font-weight:650}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--tile-line);background:var(--tile);color:var(--muted);border-radius:12px;padding:11px;min-height:58px;transition:border-color .15s,background .15s;overflow-wrap:anywhere}
.choice b{display:block;color:var(--fg);font-weight:700;font-size:.87rem;line-height:1.3}
.choice span{display:block;font-size:.74rem;line-height:1.4;margin-top:2px}
.choice:hover{border-color:var(--accent-line)}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel b{color:var(--accent-ink)}
.reco{display:inline-block!important;margin:0 0 0 5px!important;padding:0 6px;border:1px solid currentColor;border-radius:99px;color:var(--accent-ink);font-size:.54rem!important;font-weight:800;letter-spacing:.05em;text-transform:uppercase;vertical-align:2px}
.note{display:flex;gap:9px;margin-top:10px;padding:10px 12px;border-radius:11px;font-size:.84rem;color:var(--tx2);background:var(--accent-soft);border:1px solid var(--accent-line)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.note .i{flex:none;font-weight:800;color:var(--accent-ink)}
.note.warn .i{color:var(--warn)}
.group+.group{margin-top:12px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--tile-line);border-radius:11px;background:var(--tile)}
.task.done{background:var(--good-soft);border-color:var(--good-line)}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:1.5px solid var(--muted);border-radius:6px;cursor:pointer;display:grid;place-items:center;background:var(--field)}
.task input:checked{background:var(--good);border-color:var(--good)}
.task input:checked::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.task input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task label{cursor:pointer;font-size:.88rem;color:var(--tx2);min-width:0;overflow-wrap:anywhere}
.task label small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.ui{display:inline-block;font-weight:700;font-size:.92em;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line)}
.mini{border:1px dashed var(--tile-line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--field)}
.mini .cap{font:700 .6rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--label);margin-bottom:7px}
.mini .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:5px}
.mini .t{padding:6px 7px;border-radius:8px;border:1px solid var(--tile-line);background:var(--tile);font-size:.7rem;color:var(--muted);font-weight:600;position:relative;overflow-wrap:anywhere}
.mini .t.lit{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.mini .t.lit::after{content:attr(data-tap);position:absolute;top:-8px;right:5px;font:800 .52rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:0 5px;border-radius:99px}
@media (prefers-reduced-motion:no-preference){.mini .t.lit{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}}
.mini .key{display:flex;gap:5px;margin-top:6px}
.mini .key div{flex:1;min-width:0;padding:6px 8px;border-radius:7px;border:1px solid var(--tile-line);font:500 .66rem var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .key b{flex:none;padding:6px 8px;border-radius:7px;font-size:.66rem;color:var(--accent-ink);border:1px solid var(--accent-line);background:var(--accent-soft)}
.mini .cta{padding:9px;border-radius:9px;text-align:center;font-weight:800;font-size:.76rem;background:linear-gradient(135deg,#00abd3,var(--accent));color:var(--on-accent)}
.fixes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fixes .choice{min-height:0}
.fixes .choice span{font-size:.82rem;color:var(--tx2);margin-top:4px}
.done-card{margin-top:12px;padding:14px;border-radius:13px;background:var(--good-soft);border:1px solid var(--good-line);font-size:.88rem;color:var(--tx2)}
.done-card b{display:block;color:var(--good);font-size:.96rem;margin-bottom:3px}
.foot{max-width:660px;margin:16px auto 0;text-align:center;font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
@media (max-width:560px){.panel{padding:20px 14px;border-radius:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:1.6rem}.prog span{font-size:.72rem}}
</style>
</head>
<body>
<a class="skip" href="#root">Skip to the steps</a>
<header class="top"><div class="top-in">
  <div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="12" aria-labelledby="progTxt"><span id="progTxt">0 of … done</span><div class="bar"><i id="progBar"></i></div></div>
  <button type="button" id="restart">Start over</button>
  <div class="lang"><button type="button" class="lang-btn" id="langBtn" aria-haspopup="menu" aria-expanded="false" title="Language · Idioma · Langue · Sprache"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span id="langCode">EN</span></button><div class="lang-menu" id="langMenu" role="menu" hidden></div></div>
</div></header>
<main class="page">
  <div class="panel">
    <div class="head">
      <svg width="34" height="36" viewBox="0 0 24 26" aria-hidden="true"><path d="M12 1l10.4 6v12L12 25 1.6 19V7z" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--accent)"/><path d="M12 7.5l5.6 3.2v6.4L12 20.4l-5.6-3.3v-6.4z" fill="currentColor" opacity=".35" style="color:var(--accent)"/></svg>
      <div class="kicker" id="kicker">Start here · about 10 minutes</div>
      <h1>Core <span>Builds</span></h1>
      <p class="intro" id="intro"></p>
    </div>
    <div id="root" tabindex="-1"></div>
  </div>
  <p class="foot"><span id="footKept"></span><a href="https://core-builds.mintlify.app/start-here" id="footDocs">See the written guide</a><a href="../../configurator/" id="footOpen">Open the configurator</a></p>
</main>
<noscript><p style="text-align:center;padding:16px">This guide needs JavaScript. The <a href="https://core-builds.mintlify.app/start-here">written guide</a> has the same steps.</p></noscript>

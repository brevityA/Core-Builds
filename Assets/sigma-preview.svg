  <!-- Card 2: 1080P WEB-DL -->
  <rect class="card" x="16" y="198" width="768" height="158" rx="6"/>

  <text x="32" y="226" class="name">✦ The Dark Knight 「 TB 」 「 🔵 1080P 」 「 🍿 ᴡᴇʙ-ᴅʟ 」 🌟 ʜᴅʀ¹⁰ 「 🎶 ᴅᴅ+ 」 「 5.1 」</text>

  <text x="32" y="248" class="d1">『 ✦ QUALITY 』 『 🚀 INSTANT 』 『 🏷️ ɴᴛʙ 』</text>

  <text x="32" y="269" class="d2">「 🎬 🍿 ᴡᴇʙ-ᴅʟ 」 「 ʜᴇᴠᴄ 」 「 8.2 ᴍʙᴘs 」 「 🌟 ʜᴅʀ¹⁰ 」</text>

  <text x="32" y="290" class="d2">「 🎛️ 🎶 DD+ 」 🔉 5.1  🌍 🇬🇧 🇫🇷</text>

  <text x="32" y="311" class="d2">「 8.2 ɢʙ 」 「 🌱 89 」 「 ⏱️ 6ᴍ 」 「 🔍 ɴᴢʙs.ɪɴ 」</text>

  <!-- footer -->
  <text x="400" y="370" class="lbl" text-anchor="middle" fill="#484f58">Core Builds by Brevity · github.com/Branding-Brevity/Core-Builds-By-Brevity</text>

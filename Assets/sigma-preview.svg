<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .bg   { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .lbl  { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #58a6ff; letter-spacing: 0.08em; }
      .name { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .d1   { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #c9d1d9; }
      .d2   { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; }
      .tag  { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="800" height="380"/>

  <!-- Label -->
  <text x="20" y="20" class="lbl">Core Nexus Sigma — Stream Preview</text>

  <!-- Card 1: 4K REMUX using 「」/『』 bracket system -->
  <rect class="card" x="16" y="30" width="768" height="158" rx="6"/>


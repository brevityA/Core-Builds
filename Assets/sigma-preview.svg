  <!-- desc line 2: quality info in 「」 -->
  <text x="32" y="101" class="d2">「 🎬 💎 ʀᴇᴍᴜx 」 「 ʜᴇᴠᴄ 」 「 45.2 ᴍʙᴘs 」 「 👁️ ᴅᴠ ✨ ʜᴅʀ¹⁰⁺ 」</text>

  <!-- desc line 3: audio in 「」 -->
  <text x="32" y="122" class="d2">「 🎛️ 🔮 ATMOS 💎 TRUEHD 」 🔊 7.1  🌍 🇬🇧 🇫🇷 🇩🇪  🎙️ DUB</text>


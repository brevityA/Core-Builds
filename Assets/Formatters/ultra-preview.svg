<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" width="800" height="334">
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .lbl  { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #58a6ff; letter-spacing: 0.08em; text-transform: uppercase; }
      .name { font-family: 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #e6edf3; letter-spacing: .015em; }
      .d1   { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #c9d1d9; }
      .d2   { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; }
    </style>
  </defs>
  <rect class="bg" width="800" height="334"/>
  <text x="20" y="20" class="lbl">Core Nexus Ultra — Stream Preview</text>

  <rect class="card" x="16" y="30" width="768" height="122" rx="6"/>
  <text x="32" y="58" class="name">4K · ⚡ RD · BLURAY REMUX · MORTAL KOMBAT II (2026) UHD</text>
  <text x="32" y="82" class="d1">🎥 H265  DV | HDR10  EXTENDED</text>
  <text x="32" y="106" class="d2">🎧 TRUEHD  7.1  🌍 🇬🇧  💾 68.4 GB 🌱 412</text>
  <text x="32" y="143" class="d2" font-size="10.5px">drafted from the live ultra template · one topic per line · EAC3/DDP → DD+ · SDR fallback — verify against a real run</text>

  <rect class="card" x="16" y="166" width="768" height="122" rx="6"/>
  <text x="32" y="194" class="name">1080p · ⚡ TORBOX · WEB-DL · THE OFFICE (US) S02 E01</text>
  <text x="32" y="218" class="d1">🎥 H264  SDR</text>
  <text x="32" y="242" class="d2">🎧 DD+  5.1  🌍 🇬🇧  💾 2.4 GB 🌱 1204</text>
  <text x="32" y="279" class="d2" font-size="10.5px">the flagship, first preview · rows composed to match stream-data shapes the formatter receives</text>

  <text x="400" y="326" class="lbl" text-anchor="middle" fill="#484f58">Core Builds by Brevity · github.com/brevityA/Core-Builds</text>

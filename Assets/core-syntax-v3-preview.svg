  <text x="32" y="164" class="d2">◆ Rᴇʟᴇᴀsᴇ: 『 ★ DON 』 『 ⌕ ᴛᴏʀʀᴇɴᴛɪᴏ 』 『 ⛶ Iᴍᴀx 』 『 ⛨ ʀᴇᴍᴜx 』 『 ✪ Bᴇꜱᴛ 』</text>
  <text x="32" y="185" class="d1"> </text>


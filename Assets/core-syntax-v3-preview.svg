  <rect class="card" x="16" y="238" width="768" height="158" rx="6"/>
  <text x="32" y="266" class="name">✧ The Dark Knight 「 TB 」 「 1080P 」 「 WEB-DL 」 「 SUB 」 「 ᴅᴅ+ 」 「 5.1 」 『 JBL Sᴘᴀᴛɪᴀʟ 』</text>

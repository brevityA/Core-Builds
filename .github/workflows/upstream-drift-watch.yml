name: Upstream Drift Watch

# Compares the reviewed live Vidhin05 regex source against the pinned snapshot
# in Filtering/upstream/. Core Builds does not use synced stream expressions.
# Opens a single tracking issue on regex drift so the change becomes reviewed.
#
# Soft-fails on upstream outage (script exit 0 with warning) so network blips
# never spam issues.

on:
  schedule:
    - cron: '17 18 * * *'   # daily, off-the-hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: configurator/package-lock.json

      - name: Compare live upstream against pinned snapshots
        id: drift
        run: |
          set +e
          node scripts/check_upstream_drift.mjs 2>&1 | tee /tmp/drift_report.txt
          # $? after a pipeline is `tee`'s status, which is always 0 — so this
          # step reported exit_code=0 through real drift. That did not merely
          # skip the issue: it ran the "back in sync" branch below, which closes
          # an open drift issue. The HHWEB removal in Radarr/Sonarr Web T3 went
          # unreported for days behind a green tick. Read the script's own
          # status out of PIPESTATUS instead.
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Open or refresh drift issue
        if: steps.drift.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="upstream-drift"
          gh label create "$LABEL" --color "D29922" --description "Vidhin05 upstream changed — review snapshots" 2>/dev/null || true

          REPORT=$(head -c 4000 /tmp/drift_report.txt)
          BODY=$(printf '%s\n' \
            '## ⚠️ Vidhin05 upstream drift detected' \
            '' \
            'The reviewed ranked regex source has changed relative to the pinned snapshot in `Filtering/upstream/`.' \
            '' \
            'Synced stream expressions are prohibited. This issue exists only so any regex change is reviewed before it is adopted.' \
            '' \
            '```' "$REPORT" '```' \
            '' \
            '**Response checklist**' \
            '- [ ] Review the diff upstream (linked in the report)' \
            '- [ ] Re-pin snapshots with: node scripts/check_upstream_drift.mjs --update' \
            '- [ ] Check Filtering/ranked-regex-patterns.json against the elfhosted whitelist' \
            '- [ ] Re-generate affected templates if scoring changed materially' \
            '- [ ] Close this issue once snapshots are re-pinned')

          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Drift still present as of $(date -u +%Y-%m-%dT%H:%M:%SZ): ${REPORT}"
          else
            gh issue create --title "Upstream drift: Vidhin05 Releases-Regex changed" --label "$LABEL" --body "$BODY"
          fi

      - name: Close stale drift issue if back in sync
        if: steps.drift.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exit 0 covers two different outcomes: genuinely in sync, and
          # "upstream unreachable — soft pass" (deliberate, so network blips do
          # not spam issues). Only the first one justifies closing a drift
          # issue; treating an outage as proof of sync would retract a real
          # report because GitHub raw had a bad minute.
          if grep -q "upstream unreachable" /tmp/drift_report.txt; then
            echo "Upstream was unreachable this run — no sync conclusion, leaving any open issue alone."
            exit 0
          fi
          EXISTING=$(gh issue list --label "upstream-drift" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Upstream is back in sync with the pinned snapshots (verified $(date -u +%Y-%m-%dT%H:%M:%SZ))."
          fi

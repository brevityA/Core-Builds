name: Configurator CI

on:
  pull_request:
    paths:
      - 'configurator/**'
  push:
    branches: [main]
    paths:
      - 'configurator/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: configurator/package-lock.json

      - name: Install dependencies
        working-directory: configurator
        run: npm ci

      - name: Audit (non-blocking)
        working-directory: configurator
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities — review but not blocking"
        continue-on-error: true

      - name: Run tests
        working-directory: configurator
        run: npm test

      - name: Validate modules
        working-directory: configurator
        run: npm run validate

      - name: Build
        working-directory: configurator
        run: npm run build

      - name: Verify standalone output
        run: |
          node --check configurator/dist/web/assets/app.js
          # Verify the built index.html contains the current version
          BUILT_VER=$(grep -o "CONFIGURATOR_VERSION[^']*'[^']*'" configurator/dist/web/assets/app.js | head -1 || true)
          SOURCE_VER=$(grep -o "CONFIGURATOR_VERSION[^']*'[^']*'" configurator/src/js/app.js | head -1 || true)
          echo "Source: $SOURCE_VER"
          echo "Built:  $BUILT_VER"

      - name: Check committed standalone build is fresh
        run: |
          # `npm run build` overwrites configurator/index.html, so comparing it
          # with dist/index.html after the build always passes. Compare the
          # regenerated artifact with the checked-out file instead.
          if ! git diff --quiet -- configurator/index.html; then
            echo "::error::configurator/index.html is stale — run 'npm run build' in configurator/ and commit the regenerated standalone artifact"
            git --no-pager diff --stat -- configurator/index.html
            exit 1
          fi
          echo "Committed standalone artifact matches the current source build"

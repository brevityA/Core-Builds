name: Sync Doc Versions

permissions:
  contents: write

concurrency:
  group: sync-docs-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'Templates/Torbox/**/*.json'
      - 'CHANGELOG.md'
      - 'configurator/src/data/changelog.js'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Doc Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD

      - name: Run sync-docs
        id: sync
        run: |
          python3 scripts/sync-docs.py --apply 2>&1 | tee /tmp/sync_output.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node + rebuild configurator bundle (inlines tools page)
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rebuild bundle
        if: steps.sync.outputs.changed == 'true'
        run: cd configurator && npm ci --no-audit --no-fund && npm run build
      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md README.md "Templates/Torbox/README.md" "Guides/LABS.md" \
            docs/introduction.mdx docs/template-directory.mdx docs/nightly-and-labs.mdx \
            docs/changelog.mdx docs/roadmap.mdx docs/whats-new.mdx \
            ROADMAP.md tools/index.html configurator/index.html
          git commit -m "chore: sync doc versions + roadmap + tools page from changelogs"
          # Avoid races with scheduled status commits or another docs sync.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Unable to push docs sync after 3 attempts" >&2
          exit 1

name: Sync Doc Versions

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'Templates/Torbox/**/*.json'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Doc Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD

      - name: Run sync-docs
        id: sync
        run: |
          python3 scripts/sync-docs.py --apply 2>&1 | tee /tmp/sync_output.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md README.md "Templates/Torbox/README.md" "Guides/LABS.md" \
            docs/introduction.mdx docs/template-directory.mdx docs/nightly-and-labs.mdx
          git commit -m "chore: sync doc versions from template JSONs"
          git push origin HEAD:main

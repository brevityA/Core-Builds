name: Sync Doc Versions

permissions:
  contents: read

concurrency:
  group: sync-docs-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'Templates/Torbox/**/*.json'
      - 'CHANGELOG.md'
      - 'configurator/src/data/changelog.js'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Doc Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD

      - name: Run sync-docs
        id: sync
        run: |
          python3 scripts/sync-docs.py --apply 2>&1 | tee /tmp/sync_output.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # main's rules require a pull request, so this job cannot push a fix (it
      # tried, and every run with real drift failed with "push declined due to
      # repository rule violations"). The changelog-format check on each PR now
      # keeps the docs in step; this only reports drift that slipped past it.
      - name: Report drift
        if: steps.sync.outputs.changed == 'true'
        run: |
          {
            echo "### Generated docs are out of date on main"
            echo
            echo '```'
            git --no-pager diff --stat
            echo '```'
            echo
            echo "Fix in a pull request: \`python3 scripts/sync-docs.py --apply\`, then \`npm run build --prefix configurator\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Generated docs drifted on main; see the job summary for the fix"
          exit 1

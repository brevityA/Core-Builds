name: Secret scan — Discord webhook + credential shapes

# Tripwire: no Discord webhook URL — plaintext OR base64/base64url — and no
# high-confidence credential shape (GitHub tokens, AWS/Google keys, Stripe,
# Slack, private keys, …) may ever be committed to this repo. Webhooks and
# keys are stored ONLY as deployment secrets (Cloudflare `wrangler secret`,
# GitHub Actions secrets, env at runtime). Encoding is NOT security — base64
# -d reads it instantly — so both forms are blocked. The real fix for any
# historical leak is rotating the credential.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Block committed Discord webhooks (plaintext or base64/base64url)
        run: |
          set -u
          fail=0

          # 1. Plaintext. A real webhook URL carries a 15-25 digit id + a long
          #    token. The bare URL prefix (no id/token) is only documentation
          #    and must NOT trip this.
          if git grep -nIE 'discord(app)?\.com/api/webhooks/[0-9]{15,25}/[A-Za-z0-9_-]{40,}' -- .; then
            echo "::error::Plaintext Discord webhook URL found. Delete it; store via 'wrangler secret put DISCORD_WEBHOOK_URL' and rotate the webhook in Discord."
            fail=1
          fi

          # 2. Base64 / base64url encodings. Base64 encodes in 3-byte groups,
          #    so the encoding of the URL prefix trimmed to a multiple of 3
          #    appears verbatim INSIDE the encoding of any URL starting with
          #    that prefix — detection needs no token knowledge.
          for u in \
            'https://discord.com/api/webhooks/' \
            'https://discordapp.com/api/webhooks/' \
            'discord.com/api/webhooks/' \
            'discordapp.com/api/webhooks/'; do
            n=$(( ${#u} - (${#u} % 3) ))
            pfx=${u:0:n}
            std=$(printf %s "$pfx" | base64 | tr -d '=\n')
            url=$(printf %s "$pfx" | base64 | tr '+/' '-_' | tr -d '=\n')
            for b64 in "$std" "$url"; do
              if git grep -nF "$b64" -- .; then
                echo "::error::Base64-encoded Discord webhook detected (URL prefix '${u}'). Encoding is not security — delete it and use a Cloudflare secret; rotate the webhook."
                fail=1
              fi
            done
          done

          [ "$fail" -eq 0 ] || exit 1
          echo 'OK — no plaintext or base64/base64url-encoded Discord webhook in the tree.'

      - name: Block high-confidence credential shapes (tokens, keys, private keys)
        run: |
          set -u
          fail=0
          # Pattern set audited 2026-09-08: zero hits in the tree at audit
          # time. Markdown is intentionally INCLUDED (docs must not carry live
          # tokens either); binary files are skipped (-I). If a legit test
          # fixture needs a token-looking string, add it to the allowlist
          # comment below rather than weakening the patterns.
          if git grep -nIE \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|ghr_[A-Za-z0-9]{20,}' \
            -- . ':!*.pdf' ':!*.png' ':!*.svg' ':!*.jpg' ':!*.wav' ':!*.mp3' ':!*.rar'; then
            echo "::error::GitHub token detected in the tree. Revoke it (it is public now) and remove it."
            fail=1
          fi
          if git grep -nIE \
            'xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{16,}|sk_live-[0-9a-zA-Z]{16,}|pk_live_[0-9a-zA-Z]{16,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|ya29\.[A-Za-z0-9_-]{20,}|glpat-[A-Za-z0-9_-]{20,}|xoxr-|geheim-[A-Za-z0-9]{16,}|-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----' \
            -- . ':!*.pdf' ':!*.png' ':!*.svg' ':!*.jpg' ':!*.wav' ':!*.mp3' ':!*.rar'; then
            echo "::error::Credential-shaped string detected (Slack/AWS/GCP/Stripe/GitLab/private key). Remove it or rotate the credential."
            fail=1
          fi

          # Allowlist note: test fixtures and docs that need token-SHAPED
          # strings must use clearly inert values (e.g. all-zero, 'xxxx',
          # '<template_placeholder>', 'eyJhbG…xxx…') so they cannot match the
          # high-confidence shapes above.
          [ "$fail" -eq 0 ] || exit 1
          echo 'OK — no high-confidence credential shapes in the tree.'

  <style>
    :root {
      --bg-base: #0d1117; --bg-card: #161b22; --bg-input: #0d1117; --bg-track: #21262d;
      --text-main: #e6edf3; --text-muted: #8b949e; --text-dark: #484f58;
      --accent-cyan: #00d4ff; --accent-cyan-hover: #005c7a; --accent-cyan-bg: rgba(0, 212, 255, 0.15);
      --border-base: #30363d; --border-active: #00d4ff;
      --btn-next-bg: linear-gradient(135deg, #0e7490, #00d4ff);
      --btn-dl-bg: linear-gradient(135deg, #059669, #10b981);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-base); color: var(--text-main); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 20px; }
    .wrap { width: 100%; max-width: 700px; flex: 1; display: flex; flex-direction: column; }
    .hdr { margin-bottom: 22px; }
    .hdr-banner { display: flex; align-items: center; gap: 16px; background: #080c10; border: 1px solid var(--border-base); border-radius: 14px; padding: 18px 22px; margin-bottom: 16px; position: relative; overflow: hidden; }
    .hdr-banner::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,.035) 1px, transparent 1px); background-size: 56px 56px; pointer-events: none; }
    .hdr-icon { width: 52px; height: 52px; flex-shrink: 0; position: relative; z-index: 1; filter: drop-shadow(0 0 10px rgba(0,212,255,.35)); }
    .hdr-divider { width: 1.5px; height: 52px; background: linear-gradient(to bottom, transparent, rgba(0,212,255,.6), transparent); flex-shrink: 0; position: relative; z-index: 1; }
    .hdr-text { position: relative; z-index: 1; }
    .hdr-title { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; line-height: 1; margin-bottom: 3px; }
    .hdr-core { color: #fff; } .hdr-builds { color: var(--accent-cyan); }
    .hdr-underline { height: 2px; width: 110px; background: rgba(0,212,255,.45); border-radius: 1px; margin-bottom: 5px; }
    .hdr-by { font-size: .68rem; letter-spacing: .14em; color: #7eeeff; opacity: .7; margin-bottom: 4px; }
    .hdr-sub { font-size: .82rem; color: var(--text-muted); }
    .prog-wrap { margin: 0 0 6px; }
    .prog-track { background: var(--bg-track); border-radius: 4px; height: 5px; overflow: hidden; }
    .prog-fill { background: linear-gradient(90deg, #0891b2, var(--accent-cyan)); height: 100%; transition: width .35s ease; border-radius: 4px; }
    .prog-label { color: var(--text-muted); font-size: .75rem; text-align: right; margin-top: 5px; letter-spacing: .03em; }
    .card { background: var(--bg-card); border: 1px solid var(--border-base); border-radius: 14px; padding: 28px; margin-bottom: 14px; animation: fadeIn .2s ease; flex: 1; display: flex; flex-direction: column; }
    #main { flex: 1; display: flex; flex-direction: column; width: 100%; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 5px; }
    .card .desc { color: var(--text-muted); font-size: .88rem; margin-bottom: 20px; line-height: 1.5; }
    .opts { display: grid; gap: 10px; align-content: start; }
    .opts.c1 { grid-template-columns: 1fr; } .opts.c2 { grid-template-columns: 1fr 1fr; } .opts.c3 { grid-template-columns: 1fr 1fr 1fr; } .opts.c4d { grid-template-columns: 1fr 1fr; } .opts.c3d { grid-template-columns: 1fr; } .opts.c2d { grid-template-columns: 1fr; }
    .opt input { display: none; }
    .opt label { display: flex; flex-direction: column; background: var(--bg-input); border: 2px solid var(--border-base); border-radius: 10px; padding: 12px; cursor: pointer; transition: border-color .15s, background .15s; height: 100%; user-select: none; }
    .opt input:checked + label { border-color: var(--border-active); background: #00131c; box-shadow: 0 0 0 3px var(--accent-cyan-bg); }
    .opt label:hover { border-color: var(--accent-cyan-hover); }
    .opt-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .opt-icon svg { width: 36px; height: 36px; }
    .opt-body { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .opt-name { font-weight: 700; font-size: .88rem; line-height: 1.25; }
    .opt-desc { color: var(--text-muted); font-size: .76rem; margin-top: 3px; line-height: 1.4; }
    .opts.c3d .opt label, .opts.c2d .opt label { flex-direction: row; align-items: center; gap: 12px; padding: 14px; }
    .opts.c3d .opt-icon, .opts.c2d .opt-icon { margin-bottom: 0; }
    .opts.c3d .opt-icon svg, .opts.c2d .opt-icon svg { width: 30px; height: 30px; }
    .name-row label { color: var(--text-muted); font-size: .82rem; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .name-input { width: 100%; background: var(--bg-input); border: 2px solid var(--border-base); border-radius: 8px; color: var(--text-main); padding: 12px 16px; font-size: 1rem; transition: border-color .15s; outline: none; }
    .name-input:focus { border-color: var(--border-active); }
    .name-input::placeholder { color: var(--text-dark); }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .sum-item { background: var(--bg-input); border: 1px solid var(--border-base); border-radius: 8px; padding: 10px 14px; }
    .sum-lbl { color: var(--text-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
    .sum-val { font-weight: 700; font-size: .9rem; margin-top: 3px; color: var(--text-main); }
    .nav { display: flex; gap: 12px; margin-top: 6px; position: sticky; bottom: 16px; z-index: 10; }
    .nav::before { content: ''; position: absolute; inset: -20px -16px 0; background: linear-gradient(to bottom, transparent, var(--bg-base) 35%); pointer-events: none; z-index: -1; }
    .btn { padding: 12px 28px; border-radius: 9px; border: none; font-size: .97rem; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.97); } .btn:hover { opacity: .86; }
    .btn-back { background: var(--bg-track); color: var(--text-main); flex-shrink: 0; }
    .btn-next { background: var(--btn-next-bg); color: #fff; flex: 1; }
    .btn-next:disabled { opacity: .38; cursor: not-allowed; }
    .btn-dl { width: 100%; padding: 16px; font-size: 1.08rem; font-weight: 800; border-radius: 10px; border: none; cursor: pointer; background: var(--btn-dl-bg); color: #fff; margin-top: 16px; transition: opacity .15s, transform .1s; }
    .btn-dl:active { transform: scale(.98); } .btn-dl:hover { opacity: .9; }
    .btn-aio { width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 10px; border: 2px solid #0e7490; cursor: pointer; background: transparent; color: var(--accent-cyan); margin-top: 10px; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-aio:hover { background: #00131c; border-color: var(--accent-cyan); }
    .btn-aio:active { transform: scale(.98); }
    
    .aio-section { margin-top: 20px; border-top: 1px solid var(--bg-track); padding-top: 18px; }
    .aio-section h3 { font-size: .82rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .aio-fields { display: grid; gap: 10px; margin-bottom: 0; }
    
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0a2a1a; border: 1px solid #2ea043; color: #3fb950; padding: 12px 22px; border-radius: 10px; font-size: .9rem; font-weight: 600; z-index: 999; opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #1a0a0a; border-color: #8b1a1a; color: #f87171; }
    
    .import-success { background: #061a0e; border: 1px solid #2ea043; border-radius: 10px; padding: 16px; margin-top: 12px; font-size: .85rem; }
    .import-success strong { color: #3fb950; display: block; margin-bottom: 8px; font-size: .95rem; }
    .manifest-url { background: var(--bg-input); border: 1px solid var(--border-base); border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: .78rem; color: var(--text-muted); word-break: break-all; margin-top: 6px; cursor: pointer; transition: border-color .15s; }
    .manifest-url:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

    .opts.list { grid-template-columns: 1fr; }
    .opts.list .opt label { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
    .opts.list .opt-icon { margin-bottom: 0; }
    .opts.list .opt-icon svg { width: 28px; height: 28px; }
    .opts.pills { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border-base); border-radius: 11px; padding: 4px; }
    .opts.pills .opt { flex: 1; }
    .opts.pills .opt label { flex-direction: column; align-items: center; gap: 5px; padding: 12px 6px; border-radius: 8px; border: 2px solid transparent; background: transparent; color: var(--text-muted); height: auto; text-align: center; }
    .opts.pills .opt label:hover { border-color: transparent; background: var(--bg-track); color: var(--text-main); }
    .opts.pills .opt input:checked + label { background: var(--accent-cyan); color: #000; border-color: transparent; box-shadow: none; }
    .opts.pills .opt-icon { margin-bottom: 0; }
    .opts.pills .opt-icon svg { width: 22px; height: 22px; }
    .opts.pills .opt-name { font-size: .82rem; text-align: center; }
    .opts.pills .opt-desc { font-size: .68rem; margin-top: 1px; opacity: .85; text-align: center; }
    
    /* Hero layout */
    .hero-wrap { display: flex; flex-direction: column; gap: 8px; }
    .hero-hero .opt label { flex-direction: row; align-items: flex-start; gap: 16px; padding: 18px; border-radius: 12px; }
    .hero-hero .opt-icon { margin-bottom: 0; flex-shrink: 0; }
    .hero-hero .opt-icon svg { width: 44px; height: 44px; }
    .hero-badge { display: inline-block; background: #003344; color: var(--accent-cyan); font-size: .67rem; font-weight: 700; letter-spacing: .07em; padding: 3px 10px; border-radius: 20px; margin-bottom: 6px; text-transform: uppercase; }
    .hero-hero .opt-name { font-size: 1rem; font-weight: 800; }
    .hero-hero .opt-desc { font-size: .8rem; }
    .hero-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hero-sub .opt label { flex-direction: row; align-items: center; gap: 10px; padding: 12px; border-radius: 9px; }
    .hero-sub .opt-icon { margin-bottom: 0; }
    .hero-sub .opt-icon svg { width: 24px; height: 24px; }
    .hero-sub .opt-name { font-size: .84rem; }
    .hero-sub .opt-desc { font-size: .7rem; margin-top: 2px; }

    @media(min-width: 720px) {
      .wrap { max-width: 980px; }
      .card { padding: 36px; }
      .card h2 { font-size: 1.3rem; }
      .hdr-banner { padding: 22px 32px; gap: 22px; }
      .hdr-icon { width: 64px; height: 64px; }
      .hdr-divider { height: 64px; }
      .hdr-title { font-size: 2.1rem; }
      .hdr-underline { width: 136px; }
      .opts { gap: 12px; }
      .opts.c4d { grid-template-columns: repeat(4, 1fr); }
      .opts.c3d { grid-template-columns: repeat(3, 1fr); }
      .opts.c2d { grid-template-columns: repeat(2, 1fr); }
      .opt-icon svg { width: 44px; height: 44px; }
      .summary { grid-template-columns: repeat(3, 1fr); }
      .nav { max-width: 480px; }
      .hero-sub { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>

      },
      { id: 'audio', title: 'Audio', desc: 'What formats does your audio setup support?', key: 'audio', cols: 'c3d', layout: 'pills',
        opts: [
          { v: 'lossless', icon: '🔊', name: 'Full Lossless', desc: 'TrueHD · Atmos · DTS-HD MA' },
          { v: 'standard', icon: '🔉', name: 'DD+ / Atmos', desc: 'Soundbar or smart TV' },
          { v: 'limited', icon: '🔈', name: 'Auto', desc: 'Let device profile decide' }
        ]
      },
      { id: 'content', title: 'Content Type', desc: 'What will you primarily watch?', key: 'content', cols: 'c4d', layout: 'pills',
        opts: [
          { v: 'all', icon: '🌎', name: 'Everything', desc: 'Movies · TV · anime' },
          { v: 'live', icon: '🎬', name: 'Live-action', desc: 'Movies & TV · no anime' },
          { v: 'mixed', icon: '🎭', name: 'Live + Anime', desc: 'Standard + SeaDex' },
          { v: 'anime', icon: '🌸', name: 'Anime', desc: 'SeaDex Best-Only' }
        ]
      },
      { id: 'apis', title: 'API Keys', desc: 'Optional — bake your keys directly into the template. They are never sent to any server except the AIOStreams instance.', key: null, cols: 'c1', opts: [] },
      { id: 'review', title: 'Review & Download', desc: 'Confirm your settings and generate or install the template.', key: null, cols: 'c2', opts: [] }
    ];

    function label(key, val) {
      const d = DEFS.find(x => x.key === key);
      if (!d) return val || '';
      const o = d?.opts?.find(x => x.v === val);
      return o ? o.name : val || '';
    }

    function renderOpts(def) {
      const key = def.key, id = def.id;
      const inp = (o) => `<input type="radio" name="${id}" id="o_${o.v}" value="${o.v}" ${S[key] === o.v ? 'checked' : ''} data-key="${key}" data-action="update-radio">`;
      const body = (o) => `<div class="opt-body"><div class="opt-name">${o.name}</div><div class="opt-desc">${o.desc}</div></div>`;
      const std = (o, cls = '') => `<div class="opt${cls}">${inp(o)}<label for="o_${o.v}"><div class="opt-icon">${o.icon}</div>${body(o)}</label></div>`;

      if (def.layout === 'list') return `<div class="opts list">${def.opts.map(o => std(o)).join('')}</div>`;
      if (def.layout === 'pills') return `<div class="opts pills">${def.opts.map(o => std(o)).join('')}</div>`;
      if (def.layout === 'hero') {
        const hero = def.opts[0], rest = def.opts.slice(1);
        return `<div class="hero-wrap">
          <div class="hero-hero opt">${inp(hero)}<label for="o_${hero.v}"><div class="opt-icon" style="font-size:2rem">${hero.icon}</div><div class="opt-body"><div class="hero-badge">★ Most popular</div><div class="opt-name">${hero.name}</div><div class="opt-desc">${hero.desc}</div></div></label></div>
          <div class="hero-sub">${rest.map(o => std(o)).join('')}</div>
        </div>`;
      }
      return `<div class="opts ${def.cols}">${def.opts.map(o => std(o)).join('')}</div>`;
    }

    function renderProgress() {
      const pct = ((step - 1) / (STEPS - 1)) * 100;
      document.getElementById('pFill').style.width = pct + '%';
      const titles = ['Service', 'Device', 'Resolution', 'Audio', 'Content', 'APIs', 'Review'];
      document.getElementById('pLabel').textContent = `Step ${step} of ${STEPS} · ${titles[step - 1] || ''}`;
    }

    function render() {
      renderProgress();
      const main = document.getElementById('main');
      const nav = document.getElementById('nav');
      const def = DEFS[step - 1];

      if (step === STEPS) {
        const auto = S.name || "Core Nexus Custom";
        const hasApis = S.tmdbToken || S.tmdbApiKey || Object.values(S.creds).some(v=>v);
        main.innerHTML = `<section class="card">
          <h2>Your Configuration</h2>
          <p class="desc">Review your choices, download, or install directly to Stremio.</p>
          <div class="summary">
            ${['service','device','resolution','audio','content'].map(k => `
              <div class="sum-item">
                <div class="sum-lbl">${k}</div>
                <div class="sum-val">${label(k, S[k])}</div>
              </div>`).join('')}
          </div>
          <div class="name-row">
            <label for="nameIn">Template name (optional)</label>
            <input class="name-input" id="nameIn" type="text" data-action="update-name" value="${auto}" maxlength="60">
          </div>
          
          <button class="btn-dl" id="btnDownload" data-action="download">⬇ Generate &amp; Download JSON</button>
          
          <div class="aio-section">
            <h3>Install to Stremio (AIOStreams)</h3>
            <div class="aio-fields" style="margin-top:12px">
              <div class="name-row" style="margin-bottom:0">
                <label>AIOStreams Host</label>
                <select class="name-input" id="aioHost" data-action="update-host" style="cursor:pointer">
                  <option value="elfhosted" ${S.instanceHost==='elfhosted'?'selected':''}>ElfHosted — aiostreams.elfhosted.com</option>
                  <option value="fortheweak" ${S.instanceHost==='fortheweak'?'selected':''}>ForthewWeak — aiostreams.fortheweak.cloud</option>
                  <option value="midnight" ${S.instanceHost==='midnight'?'selected':''}>Midnight's — midnightignite.me</option>
                  <option value="viren" ${S.instanceHost==='viren'?'selected':''}>Viren's — aiostreams.viren070.me</option>
                  <option value="kuu" ${S.instanceHost==='kuu'?'selected':''}>Kuu's — aiostreams.stremio.ru</option>
                  <option value="atbp" ${S.instanceHost==='atbp'?'selected':''}>ATBP — aio.atbphosting.com</option>
                  <option value="omni" ${S.instanceHost==='omni'?'selected':''}>Omni's — aiostreams.12312023.xyz</option>
                  <option value="custom" ${S.instanceHost==='custom'?'selected':''}>Custom / Self-hosted</option>
                </select>
              </div>
              <div id="aioUrlRow" class="name-row" style="margin-bottom:0;${S.instanceHost==='custom'?'':'display:none'}">
                <label>Instance URL</label>
                <input class="name-input" id="aioUrl" type="url" placeholder="https://your-aiostreams.example.com" value="${S.instanceUrl}" data-action="update-instance-url">
              </div>
              <div class="name-row" style="margin-bottom:0">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                  <span style="color:var(--text-muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em">Password</span>
                  <button type="button" data-action="gen-pwd" style="font-size:.75rem;color:var(--accent-cyan);background:none;border:none;cursor:pointer;font-weight:700">Generate →</button>
                </div>
                <div style="position:relative">
                  <input class="name-input" id="aioPwd" type="password" placeholder="Create a password to protect your manifest" value="${S.instancePassword}" data-action="update-pwd" style="padding-right:40px">
                  <button type="button" id="pwdEye" data-action="toggle-pwd" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-dark);padding:2px;line-height:1">👁️</button>
                </div>
              </div>
              <div id="aioUuidRow" class="name-row" style="margin-bottom:0">
                <label>UUID <span style="font-weight:400;text-transform:none;color:var(--text-dark)">(Leave blank to create new user)</span></label>
                <input class="name-input" id="aioUuid" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" value="${S.instanceUuid}" data-action="update-uuid" style="font-family:monospace;font-size:.88rem">
              </div>
            </div>
            <button class="btn-aio" id="btnAio" data-action="install-stremio" style="margin-top:14px;background:linear-gradient(135deg,#0e7490,#00d4ff);color:#000;border:none">
              ▶ Install to Stremio
            </button>
            <div id="aioResult"></div>
          </div>
        </section>`;
        nav.style.display = 'none';
      } else if (def.id === 'apis') {
        const apiInputs = ['torbox','realdebrid','alldebrid','premiumize','debridlink']
          .filter(k => S.service.includes(k.split('-')[0]) || k === S.service || S.multiServices.includes(k));
        
        main.innerHTML = `<section class="card">
          <h2>API Keys <span style="color:var(--text-muted);font-size:.85rem;font-weight:400">(Optional)</span></h2>
          <p class="desc">${def.desc}</p>
          ${apiInputs.map(k => `
            <div class="name-row" style="margin-bottom:14px">
              <label>${k} API Key</label>
              <input class="name-input" type="text" data-action="update-api" data-service="${k}" value="${S.creds[k]||''}">
            </div>
          `).join('')}
          <div style="border-top:1px solid var(--bg-track);margin:18px 0 14px"></div>
          <div class="name-row" style="margin-bottom:14px">
            <label>TMDB Read Access Token (v4)</label>
            <input class="name-input" type="text" data-action="update-tmdb" value="${S.tmdbToken}">
          </div>
        </section>`;
        nav.style.display = 'flex';
        document.getElementById('btnBack').style.visibility = 'visible';
      } else {
        main.innerHTML = `<section class="card">
          <h2>${def.title}</h2>
          <p class="desc">${def.desc}</p>
          ${renderOpts(def)}
        </section>`;
        nav.style.display = 'flex';
        document.getElementById('btnBack').style.visibility = step > 1 ? 'visible' : 'hidden';
      }
      syncNext();
    }

    function syncNext() {
      const def = DEFS[step - 1];
      if(!def) return;
      const btn = document.getElementById('btnNext');
      let ok = !def.key || !!S[def.key];
      if (btn) btn.disabled = !ok;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '') + ' show';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = 'toast' + (isError ? ' error' : ''); }, 3200);
    }

    // --- Core Build Data Generation --- //
    
    function resolutionCfg() {
      if (S.resolution === '4k') return { excludedResolutions:['144p','240p','360p'], includedResolutions:[], requiredResolutions:[], preferredResolutions:['2160p','1080p','720p','Unknown'], maxResults:20, maxResultsPerResolution:8 };
      if (S.resolution === '1080p') return { excludedResolutions:['144p','240p','360p'], includedResolutions:[], requiredResolutions:['1080p','720p'], preferredResolutions:['1080p','720p','Unknown'], maxResults:25, maxResultsPerResolution:10 };
      return { excludedResolutions:['144p','240p','360p'], includedResolutions:[], requiredResolutions:[], preferredResolutions:['1080p','1440p','2160p','720p','576p','480p','Unknown'], maxResults:25, maxResultsPerResolution:10 };
    }
    function encodeCfg() { return { excludedEncodes: [], preferredEncodes: ['HEVC','AV1','AVC','Unknown'] }; }
    function audioCfg() { return { excludedAudioTags: [], preferredAudioTags: ['TrueHD','Atmos','DTS-HD MA','DTS:X','FLAC','DTS-HD','DD+','AAC','DTS','DD'], preferredAudioChannels: ['7.1','5.1','2.0'] }; }
    function cred(id) { return S.creds[id] ? {apiKey: S.creds[id]} : {}; }
    function services() {
      const svc = S.service;
      const m = S.multiServices;
      return [
        {id:'realdebrid', enabled: svc==='realdebrid' || svc==='hybrid' || m.includes('realdebrid'), credentials:cred('realdebrid')},
        {id:'alldebrid', enabled: svc==='alldebrid' || m.includes('alldebrid'), credentials:cred('alldebrid')},
        {id:'premiumize', enabled: svc==='premiumize' || m.includes('premiumize'), credentials:cred('premiumize')},
        {id:'debridlink', enabled: svc==='debridlink' || m.includes('debridlink'), credentials:cred('debridlink')},
        {id:'torbox', enabled: svc==='torbox-pro' || svc==='torbox-ess' || svc==='hybrid', credentials:cred('torbox')}
      ];
    }
    
    function build() {
      const rc = resolutionCfg(), ec = encodeCfg(), ac = audioCfg();
      return {
        metadata: { id: 'core-custom-' + Date.now(), name: S.name || "Core Nexus Custom", version: '0.1.0' },
        config: {
          addonName: S.name || "Core Nexus Custom",
          services: services(),
          presets: [], // Stubbed for size, would inject typical AIO streams presets
          excludedResolutions: rc.excludedResolutions,
          preferredResolutions: rc.preferredResolutions,
          requiredResolutions: rc.requiredResolutions,
          preferredEncodes: ec.preferredEncodes,
          preferredAudioTags: ac.preferredAudioTags,
          tmdbAccessToken: S.tmdbToken || '',
          sortCriteria: { global: [{key:'cached',direction:'desc'}, {key:'resolution',direction:'desc'}] },
          deduplicator: { enabled: true, cached: 'single_result', uncached: 'per_service' }
        }
      };
    }

    function generate() {
      const tmpl = build();
      const json = JSON.stringify(tmpl, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

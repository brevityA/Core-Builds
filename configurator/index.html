<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 20px}
.wrap{width:100%;max-width:700px;flex:1;display:flex;flex-direction:column}
.hdr{margin-bottom:8px}
.hdr-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#080c10 0%,#0a1018 100%);border:1px solid #1a2535;border-radius:16px;padding:16px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hdr-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,212,255,.06) 0%,transparent 60%);pointer-events:none}
.hdr-icon{width:46px;height:46px;flex-shrink:0;position:relative;z-index:1;filter:drop-shadow(0 0 8px rgba(0,212,255,.4))}
.hdr-divider{width:1px;height:44px;background:linear-gradient(to bottom,transparent,rgba(0,212,255,.5),transparent);flex-shrink:0;position:relative;z-index:1}
.hdr-text{position:relative;z-index:1;display:flex;flex-direction:column;gap:1px}
.hdr-title{font-size:1.55rem;font-weight:900;letter-spacing:-.02em;line-height:1;margin-bottom:2px}
.hdr-core{color:#fff}
.hdr-builds{color:#00d4ff}
.hdr-underline{height:1.5px;width:96px;background:linear-gradient(90deg,rgba(0,212,255,.55),transparent);border-radius:1px;margin-bottom:3px}
.hdr-by{font-size:.63rem;letter-spacing:.16em;color:#4b8fa8;margin-bottom:2px}
.hdr-sub{font-size:.78rem;color:#6b7280;line-height:1.3}
.prog-wrap{margin:0 0 6px}
.prog-track{background:#21262d;border-radius:4px;height:5px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,#0891b2,#00d4ff);height:100%;transition:width .35s ease;border-radius:4px}
.prog-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:5px}
.prog-label{color:#8b949e;font-size:.75rem;letter-spacing:.03em}
.btn-reset{background:none;border:none;color:#8b949e;font-size:.7rem;cursor:pointer;text-decoration:underline;padding:0;transition:color .15s}
.btn-reset:hover{color:#00d4ff}
.card{background:#0e1318;background-image:radial-gradient(ellipse at 12% 15%,rgba(0,180,210,.07) 0%,transparent 55%),radial-gradient(ellipse at 88% 85%,rgba(110,30,180,.05) 0%,transparent 55%);border:1px solid #1e2d3d;border-radius:14px;padding:28px;margin-bottom:14px;animation:slideInRight .22s ease;flex:1;display:flex;flex-direction:column}
#main.nav-back .card{animation-name:slideInBack}
#main{flex:1;display:flex;flex-direction:column}
.opts{align-content:start}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(13px)}to{opacity:1;transform:none}}
@keyframes slideInBack{from{opacity:0;transform:translateX(-13px)}to{opacity:1;transform:none}}
@keyframes optSelect{0%{box-shadow:0 0 0 3px rgba(0,212,255,.9),0 0 48px rgba(0,212,255,.6),inset 0 1px 0 rgba(0,212,255,.4)}60%{box-shadow:0 0 0 2px rgba(0,212,255,.5),0 0 28px rgba(0,180,220,.3),inset 0 1px 0 rgba(0,212,255,.18)}100%{box-shadow:0 0 0 1px rgba(0,212,255,.25),0 4px 28px rgba(0,180,220,.18),inset 0 1px 0 rgba(0,212,255,.12)}}
@keyframes tickPop{0%{transform:scale(0) rotate(-30deg);opacity:0}65%{transform:scale(1.28) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes hoverPulse{0%,100%{box-shadow:0 2px 12px rgba(0,180,220,.08)}50%{box-shadow:0 2px 18px rgba(0,212,255,.18)}}
@keyframes bubPulse{0%,100%{box-shadow:0 0 10px rgba(0,212,255,.7)}50%{box-shadow:0 0 20px rgba(0,212,255,1),0 0 36px rgba(0,212,255,.35)}}
@keyframes manifestPulse{0%,100%{box-shadow:0 4px 20px rgba(0,212,255,.28),inset 0 1px 0 rgba(255,255,255,.15)}50%{box-shadow:0 4px 36px rgba(0,212,255,.55),inset 0 1px 0 rgba(255,255,255,.2)}}
@keyframes dlPulse{0%,100%{box-shadow:0 4px 18px rgba(16,185,129,.28)}50%{box-shadow:0 4px 30px rgba(16,185,129,.52)}}
@keyframes btnFlash{0%{box-shadow:0 0 0 3px rgba(0,212,255,.75),0 0 32px rgba(0,212,255,.45),inset 0 1px 0 rgba(0,212,255,.3)}60%{box-shadow:0 0 0 2px rgba(0,212,255,.3),0 0 18px rgba(0,180,220,.18)}100%{box-shadow:0 4px 18px rgba(0,180,220,.18)}}
@keyframes btnHoverPulse{0%,100%{box-shadow:0 4px 22px rgba(0,180,220,.22),inset 0 1px 0 rgba(255,255,255,.1)}50%{box-shadow:0 6px 36px rgba(0,212,255,.48),inset 0 1px 0 rgba(255,255,255,.18)}}
.btn-flash{animation:btnFlash .42s cubic-bezier(.4,0,.2,1) both!important}
.card h2{font-size:1.15rem;font-weight:800;margin-bottom:5px;color:#e6edf3;text-shadow:0 0 18px rgba(0,212,255,.12)}
.card .desc{color:#8b949e;font-size:.88rem;margin-bottom:20px;line-height:1.5}
.opts{display:grid;gap:10px}
.opts.c2{grid-template-columns:1fr 1fr}
.opts.c3{grid-template-columns:1fr 1fr}
.opts.c1{grid-template-columns:1fr}
.opts.c4d{grid-template-columns:1fr 1fr}
.opts.c3d{grid-template-columns:1fr}
.opts.c2d{grid-template-columns:1fr}
.opt input{display:none}
.opt label{display:flex;flex-direction:column;background:rgba(13,17,23,.8);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:15px 13px;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s;height:100%;user-select:none;position:relative}
.opt input:checked+label{border-color:rgba(0,212,255,.65);background:rgba(0,212,255,.1);box-shadow:0 0 0 1px rgba(0,212,255,.25),0 4px 28px rgba(0,180,220,.18),inset 0 1px 0 rgba(0,212,255,.12);animation:optSelect .55s cubic-bezier(.4,0,.2,1) both}
.opt input:checked+label::after{content:'✓';position:absolute;top:7px;right:7px;width:18px;height:18px;background:#00d4ff;color:#0d1117;border-radius:50%;font-size:.65rem;font-weight:900;display:grid;place-items:center;box-shadow:0 0 8px rgba(0,212,255,.6);animation:tickPop .38s cubic-bezier(.34,1.56,.64,1) both}
.opt label:hover{border-color:rgba(0,212,255,.35);background:rgba(0,212,255,.05);animation:hoverPulse 1.6s ease-in-out infinite}
.opt-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.opt-icon svg{width:42px;height:42px}
.opt-body{display:flex;flex-direction:column;flex:1;min-width:0}
.opt-name{font-weight:700;font-size:1rem;line-height:1.25}
.opt-desc{color:#8b949e;font-size:.87rem;margin-top:4px;line-height:1.45}
.opts.c3d .opt label,.opts.c2d .opt label{flex-direction:row;align-items:center;gap:12px;padding:14px}
.opts.c3d .opt-icon,.opts.c2d .opt-icon{margin-bottom:0}
.opts.c3d .opt-icon svg,.opts.c2d .opt-icon svg{width:30px;height:30px}
.name-row label{color:#8b949e;font-size:.82rem;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.name-input{width:100%;background:#0d1117;border:2px solid #30363d;border-radius:8px;color:#e6edf3;padding:12px 16px;font-size:1rem;transition:border-color .15s;outline:none}
.name-input:focus{border-color:#00d4ff}
.name-input::placeholder{color:#484f58}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.sum-item{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px}
.sum-lbl{color:#8b949e;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.sum-val{font-weight:700;font-size:.9rem;margin-top:3px;color:#e6edf3}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:8px;position:sticky;bottom:16px;z-index:10}
.nav::before{content:'';position:absolute;inset:-28px -16px 0;background:linear-gradient(to bottom,transparent,#0d1117 40%);pointer-events:none;z-index:-1}
.btn{border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-back{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)!important;color:#6b7280;font-size:.92rem;font-weight:700;padding:11px 18px;border-radius:11px;align-self:stretch;transition:all .15s;text-align:center;letter-spacing:.01em}
.btn-back:hover{background:rgba(255,255,255,.08);color:#9ca3af;border-color:rgba(255,255,255,.18)!important;animation:hoverPulse 1.6s ease-in-out infinite}
.btn-next{width:100%;background:linear-gradient(135deg,#0077a0 0%,#004d72 100%);color:#fff;border-radius:13px;padding:14px 18px;font-size:1.02rem;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 24px rgba(0,180,220,.28),inset 0 1px 0 rgba(255,255,255,.1);text-align:left;transition:box-shadow .2s,transform .15s}
.btn-next:hover:not(:disabled){transform:translateY(-1px);animation:btnHoverPulse 1.6s ease-in-out infinite}
.btn-next:disabled{background:#111820;border:1px solid #1e2a35;color:#374151;box-shadow:none;cursor:not-allowed}
.cta-step-lbl{font-size:.62rem;font-weight:600;opacity:.6;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.cta-step-val{font-size:.95rem;font-weight:800;line-height:1}
.cta-arr{font-size:1.15rem;opacity:.75;flex-shrink:0}
.btn-dl{width:100%;padding:16px;font-size:1.16rem;font-weight:800;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#059669,#10b981);color:#fff;margin-top:16px;transition:box-shadow .2s,transform .1s,opacity .15s;box-shadow:0 4px 18px rgba(16,185,129,.28)}
.btn-dl:active{transform:scale(.98)}
.btn-dl:hover{opacity:1;box-shadow:0 6px 30px rgba(16,185,129,.55);transform:translateY(-1px)}
.btn-aio{width:100%;padding:14px;font-size:1.08rem;font-weight:700;border-radius:10px;border:2px solid #0e7490;cursor:pointer;background:transparent;color:#00d4ff;margin-top:10px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-aio:hover{background:#00131c;border-color:#00d4ff;animation:hoverPulse 1.6s ease-in-out infinite}
.btn-aio:active{transform:scale(.98)}
.aio-section{margin-top:20px;border-top:1px solid #21262d;padding-top:18px}
.aio-section h3{font-size:.82rem;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.rv-section{margin-top:12px;border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.rv-section-hdr{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:12px 16px;background:rgba(255,255,255,.02);font-size:.78rem;font-weight:700;color:#6b7280;letter-spacing:.04em;text-transform:uppercase;user-select:none;transition:background .15s}
.rv-section-hdr:hover{background:rgba(255,255,255,.04)}
.rv-section-hdr .rv-ico{display:flex;align-items:center;gap:8px}
.rv-section-hdr .rv-arr{font-size:.7rem;color:#374151;transition:transform .2s}
.rv-section[open] .rv-arr{transform:rotate(90deg)}
.rv-section-body{padding:14px 16px;border-top:1px solid rgba(255,255,255,.04)}
.aio-fields{display:grid;gap:10px;margin-bottom:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#001a24,#000e18);border:1px solid rgba(0,212,255,.4);color:#00d4ff;padding:12px 22px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,180,220,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:linear-gradient(135deg,#1a0a0a,#120000);border-color:rgba(248,113,113,.45);color:#f87171;box-shadow:0 4px 20px rgba(220,38,38,.2)}
.import-success{background:#061a0e;border:1px solid #2ea043;border-radius:10px;padding:16px;margin-top:12px;font-size:.85rem}
.import-success strong{color:#3fb950;display:block;margin-bottom:8px;font-size:.95rem}
.manifest-url{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;font-family:monospace;font-size:.78rem;color:#8b949e;word-break:break-all;margin-top:6px;cursor:pointer;transition:border-color .15s}
.manifest-url:hover{border-color:#00d4ff;color:#00d4ff}
.notice{background:#0d2317;border:1px solid #2ea043;border-radius:9px;padding:13px 16px;font-size:.83rem;color:#8b949e;margin-top:14px;line-height:1.5}
.inst-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.inst-chip{display:inline-flex;align-items:center;padding:6px 13px;background:#0d1117;border:1px solid #30363d;border-radius:20px;font-size:.84rem;color:#8b949e;text-decoration:none;transition:border-color .15s,color .15s;white-space:nowrap}
.inst-chip:hover{border-color:#00d4ff;color:#00d4ff}
.inst-chip-import{background:#001428;border-color:#0e7490;color:#00d4ff}
.inst-chip-import:hover{background:#002a50;border-color:#00d4ff;color:#7ee8ff}
.notice strong{color:#3fb950;display:block;margin-bottom:3px}
/* Size limit presets */
.size-btn{padding:7px 16px;border-radius:8px;border:1.5px solid #30363d;background:#0d1117;color:#8b949e;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s}
.size-btn:hover{border-color:#005c7a;color:#e6edf3}
.size-btn-active{border-color:#00d4ff!important;background:#00131c!important;color:#00d4ff!important}
/* List layout */
.opts.list{grid-template-columns:1fr}
.opts.list .opt label{flex-direction:row;align-items:center;gap:14px;padding:13px 16px;border-color:rgba(255,255,255,.14)}
.opts.list .opt-icon{margin-bottom:0}
.opts.list .opt-icon svg{width:28px;height:28px;filter:drop-shadow(0 0 5px rgba(255,255,255,.18))}
.opts.list .opt input:checked+label .opt-icon svg{filter:drop-shadow(0 0 14px rgba(0,212,255,.6))}
/* Pill layout */
.opts.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:transparent;border:none;padding:0}
.opts.pills .opt{flex:1}
.opts.pills .opt label{flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(8,12,18,.9);color:#6b7280;height:auto;text-align:center}
.opts.pills .opt label:hover{border-color:rgba(0,212,255,.38);background:rgba(0,212,255,.06);color:#e6edf3;box-shadow:0 2px 12px rgba(0,180,220,.1)}
.opts.pills .opt input:checked+label{background:rgba(0,212,255,.12);color:#00d4ff;border-color:rgba(0,212,255,.65);box-shadow:0 0 0 1px rgba(0,212,255,.25),0 4px 24px rgba(0,180,220,.2),inset 0 1px 0 rgba(0,212,255,.12);animation:optSelect .55s cubic-bezier(.4,0,.2,1) both}
.opts.pills .opt-icon svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.16))}
.opts.pills .opt input:checked+label .opt-icon svg{filter:drop-shadow(0 0 14px rgba(0,212,255,.55))}
.opts.pills .opt-icon{margin-bottom:0}
.opts.pills .opt-icon svg{width:30px;height:30px}
.opts.pills .opt-body{align-items:center}
.opts.pills .opt-name{font-size:.97rem;text-align:center}
.opts.pills .opt-desc{font-size:.8rem;margin-top:3px;opacity:.85;text-align:center}
/* Hero layout */
.hero-wrap{display:flex;flex-direction:column;gap:8px}
.hero-hero .opt label{flex-direction:row;align-items:flex-start;gap:16px;padding:18px;border-radius:12px}
.hero-hero .opt-icon{margin-bottom:0;flex-shrink:0}
.hero-hero .opt-icon svg{width:44px;height:44px}
.hero-badge{display:inline-block;background:#003344;color:#00d4ff;font-size:.67rem;font-weight:700;letter-spacing:.07em;padding:3px 10px;border-radius:20px;margin-bottom:6px;text-transform:uppercase}
.hero-hero .opt-name{font-size:1rem;font-weight:800}
.hero-hero .opt-desc{font-size:.8rem}
.hero-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-sub .opt label{flex-direction:row;align-items:center;gap:10px;padding:12px;border-radius:9px}
.hero-sub .opt-icon{margin-bottom:0}

@media(pointer:coarse){

/* Toggle switch */
.toggle-sw{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle-sw input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;cursor:pointer;inset:0;background:#30363d;border-radius:24px;transition:.15s}
.toggle-track::before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#e6edf3;border-radius:50%;transition:.15s}
.toggle-sw input:checked~.toggle-track{background:#00d4ff}
.toggle-sw input:checked~.toggle-track::before{transform:translateX(20px);background:#fff}
/* Version badge */
.ver-badge{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:4px;background:#00131c;border:1px solid #005c7a;color:#00d4ff;text-decoration:none;letter-spacing:.04em;vertical-align:middle;transition:all .15s}
.ver-badge:hover{background:#002a40;border-color:#00d4ff;color:#7eeeff}
/* Manifest modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px);animation:fadeIn .18s ease}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px 22px;max-width:460px;width:100%;position:relative;animation:slideUp .22s ease;max-height:90dvh;overflow-y:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#6b7280;cursor:pointer;font-size:1.5rem;line-height:1;padding:2px 8px;border-radius:6px;transition:color .15s}
.modal-close:hover{color:#e6edf3}
.modal-success-icon{width:48px;height:48px;background:#061a0e;border:2px solid #2ea043;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.modal-title{font-size:1.18rem;font-weight:800;text-align:center;margin-bottom:4px}
.modal-sub{color:#6b7280;font-size:.8rem;text-align:center;margin-bottom:18px;line-height:1.5}
.fmt-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.fmt-tab{padding:6px 14px;border-radius:7px;border:1.5px solid #30363d;background:#0d1117;color:#6b7280;font-size:.86rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}

.copy-field{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.copy-field-label{color:#6b7280;font-size:.67rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.copy-field-val{font-family:monospace;font-size:.74rem;color:#c9d1d9;word-break:break-all}
.copy-field-val.pwd-val{font-size:.9rem;letter-spacing:.05em;color:#e6edf3;font-family:inherit}
.copy-btn{background:#21262d;border:none;border-radius:6px;color:#8b949e;cursor:pointer;padding:6px 11px;flex-shrink:0;font-size:.8rem;font-weight:700;transition:all .15s}
.copy-btn:hover{background:#30363d;color:#e6edf3}
.copy-btn.copied{background:#061a0e;color:#3fb950}
.qr-wrap{display:flex;justify-content:center;margin:12px 0 3px}
.qr-wrap img{border-radius:8px;border:1px solid #21262d;background:#0d1117}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.m-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;text-decoration:none;transition:all .15s;white-space:nowrap;min-width:0}
.m-btn:active{transform:scale(.97)}
.m-install{background:linear-gradient(135deg,#0e7490,#00d4ff);color:#000}
.m-web{background:#1a1f2e;border:1.5px solid #00d4ff!important;color:#00d4ff}
.m-wu{background:#16103a;border:1.5px solid #4f46e5!important;color:#a78bfa}
.m-nuvio{background:#1a1200;border:1.5px solid #d97706!important;color:#f59e0b}
.m-done{background:#21262d;color:#8b949e}
.m-done:hover{color:#e6edf3}
/* Manifest primary button */
.btn-manifest{width:100%;padding:15px;font-size:1.13rem;font-weight:800;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#0891b2,#00d4ff);color:#000;transition:box-shadow .2s,transform .15s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;box-shadow:0 4px 20px rgba(0,212,255,.28),inset 0 1px 0 rgba(255,255,255,.15)}

.btn-manifest:active{transform:scale(.98)}
.btn-manifest:disabled{opacity:.38;cursor:not-allowed}
/* API Reminder modal */
@keyframes reminderIn{0%{opacity:0;transform:translateY(32px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes overlayIn{0%{opacity:0}100%{opacity:1}}
#apiReminder{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .22s ease both;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#apiReminderCard{background:linear-gradient(160deg,#0a1520 0%,#060d14 100%);border:1px solid rgba(0,212,255,.35);border-radius:18px;width:100%;max-width:400px;padding:28px 24px 22px;box-shadow:0 0 0 1px rgba(0,212,255,.12),0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(0,212,255,.06);animation:reminderIn .3s cubic-bezier(.34,1.12,.64,1) both}
#apiReminderCard .rem-icon{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.08));border:1.5px solid rgba(251,191,36,.35);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 24px rgba(251,191,36,.12)}
#apiReminderCard .rem-title{font-size:1.12rem;font-weight:900;color:#e6edf3;text-align:center;margin-bottom:5px}

#apiReminderCard .rem-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}

#apiReminderCard .rem-field-name{font-size:.75rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
#apiReminderCard .rem-field-link{font-size:.73rem;color:#00d4ff;text-decoration:none;font-weight:700}
#apiReminderCard .rem-input{width:100%;background:#0d1117;border:1.5px solid #30363d;border-radius:9px;color:#e6edf3;padding:11px 14px;font-size:.9rem;outline:none;transition:border-color .15s;font-family:monospace}
#apiReminderCard .rem-input:focus{border-color:rgba(0,212,255,.55);box-shadow:0 0 0 3px rgba(0,212,255,.08)}
#apiReminderCard .rem-actions{display:flex;flex-direction:column;gap:8px}
#apiReminderCard .rem-save{width:100%;padding:13px;font-size:.95rem;font-weight:800;border:none;border-radius:11px;background:linear-gradient(135deg,#0891b2,#00d4ff);color:#000;cursor:pointer;transition:all .15s}
#apiReminderCard .rem-save:hover{box-shadow:0 4px 24px rgba(0,212,255,.4);transform:translateY(-1px)}
#apiReminderCard .rem-skip{background:transparent;border:none;color:#4b5563;font-size:.8rem;cursor:pointer;padding:6px;text-align:center;width:100%;transition:color .15s}
#apiReminderCard .rem-skip:hover{color:#9ca3af}
#pwdPrompt{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .22s ease both;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pwdPrompt.hidden{display:none}
#pwdPromptCard{background:linear-gradient(160deg,#0a1520 0%,#060d14 100%);border:1px solid rgba(0,212,255,.35);border-radius:18px;width:100%;max-width:380px;padding:28px 24px 22px;box-shadow:0 0 0 1px rgba(0,212,255,.12),0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(0,212,255,.06);animation:reminderIn .3s cubic-bezier(.34,1.12,.64,1) both}
#pwdPromptCard .pwd-title{font-size:1.05rem;font-weight:900;color:#e6edf3;text-align:center;margin-bottom:4px}
#pwdPromptCard .pwd-sub{font-size:.8rem;color:#6b7280;text-align:center;margin-bottom:18px;line-height:1.5}
#pwdPromptCard .pwd-option{background:#0d1117;border:1.5px solid #30363d;border-radius:11px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:10px}
#pwdPromptCard .pwd-option:hover{border-color:rgba(0,212,255,.4);background:rgba(0,212,255,.04)}
#pwdPromptCard .pwd-option.active{border-color:rgba(0,212,255,.6);background:rgba(0,212,255,.06)}
#pwdPromptCard .pwd-option-label{font-size:.88rem;font-weight:700;color:#e6edf3;margin-bottom:2px}
#pwdPromptCard .pwd-option-hint{font-size:.75rem;color:#6b7280}
#pwdPromptCard .pwd-auto-val{font-family:monospace;font-size:.85rem;color:#00d4ff;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.15);border-radius:7px;padding:8px 12px;margin-top:8px;word-break:break-all;user-select:all}
#pwdPromptCard .pwd-manual-input{width:100%;background:#0d1117;border:1.5px solid #30363d;border-radius:9px;color:#e6edf3;padding:10px 14px;font-size:.88rem;outline:none;transition:border-color .15s;margin-top:8px;font-family:monospace}
#pwdPromptCard .pwd-manual-input:focus{border-color:rgba(0,212,255,.55);box-shadow:0 0 0 3px rgba(0,212,255,.08)}
#pwdPromptCard .pwd-go{width:100%;padding:13px;font-size:.95rem;font-weight:800;border:none;border-radius:11px;background:linear-gradient(135deg,#0891b2,#00d4ff);color:#000;cursor:pointer;transition:all .15s;margin-top:14px}
#pwdPromptCard .pwd-go:hover{box-shadow:0 4px 24px rgba(0,212,255,.4);transform:translateY(-1px)}
#pwdPromptCard .pwd-go:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
#pwdPromptCard .pwd-cancel{background:transparent;border:none;color:#4b5563;font-size:.8rem;cursor:pointer;padding:6px;text-align:center;width:100%;transition:color .15s;margin-top:4px}
#pwdPromptCard .pwd-cancel:hover{color:#9ca3af}
/* Connecting dots animation */
@keyframes dotPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.dot-spin span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:currentColor;animation:dotPulse 1.2s ease-in-out infinite}
.dot-spin span:nth-child(2){animation-delay:.2s}
.dot-spin span:nth-child(3){animation-delay:.4s}
/* Duck-style preference toggle cards */
.pref-section{margin-bottom:20px}
.pref-section-label{font-size:.75rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.pref-card{background:#0d1117;border:1.5px solid #30363d;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;margin-bottom:8px}
.pref-card:last-child{margin-bottom:0}
.pref-card:hover{border-color:#005c7a}
.pref-card.pref-on{border-color:#00d4ff;background:#00131c}
.pref-body-inner{flex:1;min-width:0}
.pref-title{font-weight:700;font-size:.9rem;color:#e6edf3;line-height:1.3}
.pref-desc{color:#6b7280;font-size:.78rem;margin-top:2px;line-height:1.4}
.pref-circle{width:22px;height:22px;border-radius:50%;border:2px solid #374151;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent}
.pref-card.pref-on .pref-circle{background:#00d4ff;border-color:#00d4ff}
/* Formatter live preview card */
.fmt-live-preview{background:#111827;border:1px solid #1e2837;border-radius:8px;padding:11px 13px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.fmt-live-poster{width:36px;height:52px;border-radius:4px;background:#1e2837;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.fmt-live-lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fmt-live-n{font-size:.73rem;color:#e2e8f0;line-height:1.55;word-break:break-word}
.fmt-live-d{font-size:.7rem;color:#6b7280;line-height:1.55;word-break:break-word}
/* Animated logo */
@keyframes corePulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.07);opacity:1}}
@keyframes coreGlowPulse{0%,100%{transform:scale(1);opacity:.38}50%{transform:scale(1.24);opacity:.84}}
@keyframes coreRingOut{0%{transform:scale(.5);opacity:.7}100%{transform:scale(2);opacity:0}}
@keyframes hexBreath{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes coreTextPulse{0%,100%{text-shadow:none}50%{text-shadow:0 0 14px rgba(255,255,255,.55),0 0 28px rgba(255,255,255,.18)}}
.diamond-core{transform-box:fill-box;transform-origin:center;animation:corePulse 2.6s ease-in-out infinite}
.diamond-glow{transform-box:fill-box;transform-origin:center;animation:coreGlowPulse 2.6s ease-in-out infinite}
.core-ring{transform-box:fill-box;transform-origin:center;fill:none;stroke-width:5;animation:coreRingOut 2.6s ease-out infinite}
.core-ring-2{animation-delay:1.3s}
.hex-glow-layer{animation:hexBreath 2.6s ease-in-out infinite}
.hdr-core{animation:coreTextPulse 2.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.diamond-core,.diamond-glow,.core-ring,.hex-glow-layer,.hdr-core{animation:none}}
.srh{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.05)}
.srh-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.srh-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;color:#00d4ff}
.srh-title{font-size:1.15rem;font-weight:900;letter-spacing:-.02em;line-height:1.1;color:#e6edf3}
.srh-sub{font-size:.84rem;color:#7ea4bd;margin-top:4px;line-height:1.4}
.step-strip{display:flex;align-items:center;padding:10px 0 6px;position:relative}
.step-unit{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;min-width:0}
.step-unit:not(:first-child)::before{content:'';position:absolute;top:50%;transform:translateY(-50%);right:50%;width:100%;height:1px;background:#2d333b;z-index:0;transition:background .3s}
.step-unit.done::before{background:linear-gradient(90deg,rgba(0,212,255,.55),rgba(0,212,255,.2))}
.step-bub{width:10px;height:10px;border-radius:50%;position:relative;z-index:1;flex-shrink:0;transition:all .25s;display:grid;place-items:center;font-size:0;color:transparent}
.step-pending .step-bub{background:#2d333b}

[data-theme="light"] .import-error strong[style]{color:#cf222e!important}
[data-theme="light"] .import-info{border-color:#d0d7de!important;background:#f6f8fa!important}
[data-theme="light"] .import-info strong[style]{color:#1f2328!important}
.insights-box{background:#060e15;border:1px solid #162030;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.insights-hdr{color:#7eeeff;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.insights-box li{color:#8b949e;font-size:.85rem;line-height:1.45;display:flex;gap:6px}
[data-theme="light"] .insights-box{background:#f0f9ff;border-color:#bae6fd}
[data-theme="light"] .insights-hdr{color:#0369a1}
[data-theme="light"] .insights-box li{color:#57606a}
[data-theme="light"] .what-next strong[style]{color:#9a3412!important}
[data-theme="light"] .wn-title{color:#1f2328!important}
[data-theme="light"] .wn-body{color:#57606a!important}
[data-theme="light"] .cred-remind strong[style]{color:#9a3412!important}
[data-theme="light"] .cred-remind .cr-hdr{color:#b45309!important}
[data-theme="light"] .import-success strong[style*="e6edf3"]{color:#1f2328!important}
[data-theme="light"] .import-success strong[style*="fbbf24"]{color:#9a3412!important}
.fmt-card{border:1.5px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(8,12,18,.9);cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s;overflow:hidden}
.fmt-card[data-active="true"]{border-color:rgba(0,212,255,.65);background:rgba(0,212,255,.08);box-shadow:0 0 0 1px rgba(0,212,255,.22)}
.fmt-card .fmt-lbl{color:#e6edf3}
.fmt-card[data-active="true"] .fmt-lbl{color:#00d4ff!important}
.fmt-card .fmt-preview-wrap{display:none;padding:0 13px 11px}
.fmt-card[data-active="true"] .fmt-preview-wrap{display:block}
.fmt-arr{color:#374151;font-size:.9rem;flex-shrink:0}
.fmt-card[data-active="true"] .fmt-arr{color:#00d4ff}
.fmt-arr::after{content:'›'}
.fmt-card[data-active="true"] .fmt-arr::after{content:'✓'}
[data-theme="light"] .fmt-card{background:#fff;border-color:#d0d7de}
[data-theme="light"] .fmt-card[data-active="true"]{background:rgba(9,105,218,.06);border-color:#0969da;box-shadow:0 0 0 1px rgba(9,105,218,.2)}
[data-theme="light"] .fmt-card .fmt-lbl{color:#1f2328}
[data-theme="light"] .fmt-card[data-active="true"] .fmt-lbl{color:#0969da!important}
.test-key-btn{font-size:.75rem;font-weight:700;color:#a5b4fc;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.3);border-radius:6px;padding:2px 10px;cursor:pointer;transition:all .15s;margin-right:10px}
.test-key-btn:hover{background:rgba(99,102,241,.18)}
.test-key-btn:disabled{opacity:.5;cursor:wait}
.cred-status{font-size:.74rem;margin-top:4px;min-height:16px;display:block}
[data-theme="light"] .test-key-btn{color:#4f46e5;background:rgba(79,70,229,.06);border-color:rgba(79,70,229,.3)}
.help-btn{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#6b7280;font-size:.7rem;font-weight:800;cursor:pointer;flex-shrink:0;line-height:1;margin-right:8px;transition:all .15s;padding:0}
.help-btn:hover{color:#00d4ff;border-color:rgba(0,212,255,.4)}
.device-help{font-size:.8rem;color:#8b949e;line-height:1.55;padding:9px 14px 11px;border-top:1px dashed rgba(255,255,255,.09);display:none}
.device-help b{color:#c9d1d9}
[data-theme="light"] .device-help{color:#57606a;border-color:rgba(0,0,0,.12)}
[data-theme="light"] .device-help b{color:#1f2328}
[data-theme="light"] .help-btn{border-color:rgba(0,0,0,.15);background:rgba(0,0,0,.03);color:#8c959f}
.step-unit.done{cursor:pointer}
.step-unit.done:hover .step-bub{box-shadow:0 0 10px rgba(0,212,255,.8);transform:scale(1.3)}
.step-unit.done:hover .step-lbl{color:#00d4ff}
.receipt-row[data-action]{cursor:pointer;transition:background .15s}
.receipt-row[data-action]:hover{background:rgba(0,212,255,.05)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('cbTheme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}catch(e){}</script>
</head>

<div id="cb-loader">
  <svg id="cb-loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="lg1" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#4facfe"/></linearGradient>
      <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4facfe"/><stop offset="50%" stop-color="#8a4890"/><stop offset="100%" stop-color="#c03a20"/></linearGradient>
      <radialGradient id="lrmask" cx="50%" cy="50%" r="50%"><stop offset="20%" stop-color="white" stop-opacity="1"/><stop offset="70%" stop-color="white" stop-opacity="0.6"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient>

      <filter id="lf4"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    </defs>
    <g mask="url(#lm)">
      <polygon points="256,41 442,149 442,363 256,471 70,363 70,149" fill="#00c4d9" opacity="0.14" filter="url(#lf3)"/>
      <polygon points="256,166 346,256 256,346 166,256" fill="#8a4890" opacity="0.22" filter="url(#lf3)"/>
      <polygon class="hex-glow-layer" points="256,41 442,149 442,363 256,471 70,363 70,149" fill="none" stroke="#00e5ff" stroke-width="52" stroke-linejoin="round" opacity="0.18" filter="url(#lf1)"/>
      <polygon class="hex-glow-layer" points="256,41 442,149 442,363 256,471 70,363 70,149" fill="none" stroke="#00e5ff" stroke-width="18" stroke-linejoin="round" opacity="0.28" filter="url(#lf4)"/>
      <polygon class="hex-glow-layer" points="256,41 442,149 442,363 256,471 70,363 70,149" fill="none" stroke="url(#lg1)" stroke-width="14" stroke-linejoin="round" opacity="0.82"/>
      <polygon class="diamond-glow" points="256,166 346,256 256,346 166,256" fill="url(#lg2)" opacity="0.3" filter="url(#lf2)"/>
      <polygon class="diamond-core" points="256,166 346,256 256,346 166,256" fill="url(#lg2)" opacity="0.7"/>
      <circle class="core-ring" cx="256" cy="256" r="90" stroke="url(#lg2)" opacity=".42"/>
      <circle class="core-ring core-ring-2" cx="256" cy="256" r="90" stroke="url(#lg2)" opacity=".42"/>
    </g>
  </svg>
  <div id="cb-loader-title">CORE <span>BUILDS</span></div>
  <div id="cb-loader-sub">by Brevity</div>

  <div id="main"></div>

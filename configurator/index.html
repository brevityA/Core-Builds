<html lang="en">

  <style>
    :root {
      --bg-base: #0d1117;
      --bg-card: #161b22;
      --bg-input: #0d1117;
      --bg-track: #21262d;
      
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --text-dark: #484f58;
      
      --accent-cyan: #00d4ff;
      --accent-cyan-hover: #005c7a;
      --accent-cyan-bg: rgba(0, 212, 255, 0.15);
      
      --border-base: #30363d;
      --border-active: #00d4ff;
      
      --btn-next-bg: linear-gradient(135deg, #0e7490, #00d4ff);
      --btn-dl-bg: linear-gradient(135deg, #059669, #10b981);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 20px;
    }

    .wrap { width: 100%; max-width: 700px; flex: 1; display: flex; flex-direction: column; }
    .hdr { margin-bottom: 22px; }
    
    .hdr-banner {
      display: flex; align-items: center; gap: 16px;
      background: #080c10; border: 1px solid var(--border-base);
      border-radius: 14px; padding: 18px 22px; margin-bottom: 16px;
      position: relative; overflow: hidden;
    }
    
    .hdr-banner::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(0,212,255,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,212,255,.035) 1px, transparent 1px);
      background-size: 56px 56px; pointer-events: none;
    }
    
    .hdr-icon { width: 52px; height: 52px; flex-shrink: 0; position: relative; z-index: 1; filter: drop-shadow(0 0 10px rgba(0,212,255,.35)); }
    .hdr-divider { width: 1.5px; height: 52px; background: linear-gradient(to bottom, transparent, rgba(0,212,255,.6), transparent); flex-shrink: 0; position: relative; z-index: 1; }
    .hdr-text { position: relative; z-index: 1; }
    .hdr-title { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; line-height: 1; margin-bottom: 3px; }
    .hdr-core { color: #fff; }
    .hdr-builds { color: var(--accent-cyan); }
    .hdr-underline { height: 2px; width: 110px; background: rgba(0,212,255,.45); border-radius: 1px; margin-bottom: 5px; }
    .hdr-by { font-size: .68rem; letter-spacing: .14em; color: #7eeeff; opacity: .7; margin-bottom: 4px; }
    .hdr-sub { font-size: .82rem; color: var(--text-muted); }
    
    .prog-wrap { margin: 0 0 6px; }
    .prog-track { background: var(--bg-track); border-radius: 4px; height: 5px; overflow: hidden; }
    .prog-fill { background: linear-gradient(90deg, #0891b2, var(--accent-cyan)); height: 100%; transition: width .35s ease; border-radius: 4px; }
    .prog-label { color: var(--text-muted); font-size: .75rem; text-align: right; margin-top: 5px; letter-spacing: .03em; }
    
    .card {
      background: var(--bg-card); border: 1px solid var(--border-base);
      border-radius: 14px; padding: 28px; margin-bottom: 14px;
      animation: fadeIn .2s ease; flex: 1; display: flex; flex-direction: column;
    }
    
    #main { flex: 1; display: flex; flex-direction: column; width: 100%; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    
    .card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 5px; }
    .card .desc { color: var(--text-muted); font-size: .88rem; margin-bottom: 20px; line-height: 1.5; }
    
    .opts { display: grid; gap: 10px; align-content: start; }
    .opts.c1 { grid-template-columns: 1fr; }
    .opts.c2 { grid-template-columns: 1fr 1fr; }
    .opts.c3 { grid-template-columns: 1fr 1fr 1fr; }
    .opts.c4d { grid-template-columns: 1fr 1fr; }
    .opts.c3d { grid-template-columns: 1fr; }
    .opts.c2d { grid-template-columns: 1fr; }
    
    .opt input { display: none; }
    .opt label {
      display: flex; flex-direction: column; background: var(--bg-input);
      border: 2px solid var(--border-base); border-radius: 10px; padding: 12px;
      cursor: pointer; transition: border-color .15s, background .15s;
      height: 100%; user-select: none;
    }
    .opt input:checked + label {
      border-color: var(--border-active); background: #00131c;
      box-shadow: 0 0 0 3px var(--accent-cyan-bg);
    }
    .opt label:hover { border-color: var(--accent-cyan-hover); }
    
    .opt-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .opt-icon svg { width: 36px; height: 36px; }
    
    .opt-body { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .opt-name { font-weight: 700; font-size: .88rem; line-height: 1.25; }
    .opt-desc { color: var(--text-muted); font-size: .76rem; margin-top: 3px; line-height: 1.4; }
    
    .opts.c3d .opt label, .opts.c2d .opt label { flex-direction: row; align-items: center; gap: 12px; padding: 14px; }
    .opts.c3d .opt-icon, .opts.c2d .opt-icon { margin-bottom: 0; }
    .opts.c3d .opt-icon svg, .opts.c2d .opt-icon svg { width: 30px; height: 30px; }
    
    .name-row label { color: var(--text-muted); font-size: .82rem; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .name-input {
      width: 100%; background: var(--bg-input); border: 2px solid var(--border-base);
      border-radius: 8px; color: var(--text-main); padding: 12px 16px;
      font-size: 1rem; transition: border-color .15s; outline: none;
    }
    .name-input:focus { border-color: var(--border-active); }
    .name-input::placeholder { color: var(--text-dark); }
    
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .sum-item { background: var(--bg-input); border: 1px solid var(--border-base); border-radius: 8px; padding: 10px 14px; }
    .sum-lbl { color: var(--text-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
    .sum-val { font-weight: 700; font-size: .9rem; margin-top: 3px; color: var(--text-main); }
    
    .nav { display: flex; gap: 12px; margin-top: 6px; position: sticky; bottom: 16px; z-index: 10; }
    .nav::before {
      content: ''; position: absolute; inset: -20px -16px 0;
      background: linear-gradient(to bottom, transparent, var(--bg-base) 35%);
      pointer-events: none; z-index: -1;
    }
    
    .btn { padding: 12px 28px; border-radius: 9px; border: none; font-size: .97rem; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.97); }
    .btn:hover { opacity: .86; }
    .btn-back { background: var(--bg-track); color: var(--text-main); flex-shrink: 0; }
    .btn-next { background: var(--btn-next-bg); color: #fff; flex: 1; }
    .btn-next:disabled { opacity: .38; cursor: not-allowed; }
    
    .btn-dl { width: 100%; padding: 16px; font-size: 1.08rem; font-weight: 800; border-radius: 10px; border: none; cursor: pointer; background: var(--btn-dl-bg); color: #fff; margin-top: 16px; transition: opacity .15s, transform .1s; }
    .btn-dl:active { transform: scale(.98); }
    .btn-dl:hover { opacity: .9; }
    
    .btn-aio {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;
      border-radius: 10px; border: 2px solid #0e7490; cursor: pointer;
      background: transparent; color: var(--accent-cyan); margin-top: 10px;
      transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-aio:hover { background: #00131c; border-color: var(--accent-cyan); }
    .btn-aio:active { transform: scale(.98); }
    
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0a2a1a; border: 1px solid #2ea043; color: #3fb950;
      padding: 12px 22px; border-radius: 10px; font-size: .9rem; font-weight: 600;
      z-index: 999; opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #1a0a0a; border-color: #8b1a1a; color: #f87171; }

    /* Layout overrides */
    .opts.list { grid-template-columns: 1fr; }
    .opts.list .opt label { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
    .opts.list .opt-icon { margin-bottom: 0; }
    .opts.list .opt-icon svg { width: 28px; height: 28px; }

    .opts.pills { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border-base); border-radius: 11px; padding: 4px; }
    .opts.pills .opt { flex: 1; }
    .opts.pills .opt label { flex-direction: column; align-items: center; gap: 5px; padding: 12px 6px; border-radius: 8px; border: 2px solid transparent; background: transparent; color: var(--text-muted); height: auto; text-align: center; }
    .opts.pills .opt label:hover { border-color: transparent; background: var(--bg-track); color: var(--text-main); }
    .opts.pills .opt input:checked + label { background: var(--accent-cyan); color: #000; border-color: transparent; box-shadow: none; }
    .opts.pills .opt-icon { margin-bottom: 0; }
    .opts.pills .opt-icon svg { width: 22px; height: 22px; }
    .opts.pills .opt-name { font-size: .82rem; text-align: center; }
    .opts.pills .opt-desc { font-size: .68rem; margin-top: 1px; opacity: .85; text-align: center; }

    @media(min-width: 720px) {
      .wrap { max-width: 980px; }
      .card { padding: 36px; }
      .card h2 { font-size: 1.3rem; }
      .hdr-banner { padding: 22px 32px; gap: 22px; }
      .hdr-icon { width: 64px; height: 64px; }
      .hdr-divider { height: 64px; }
      .hdr-title { font-size: 2.1rem; }
      .hdr-underline { width: 136px; }
      .opts { gap: 12px; }
      .opts.c4d { grid-template-columns: repeat(4, 1fr); }
      .opts.c3d { grid-template-columns: repeat(3, 1fr); }
      .opts.c2d { grid-template-columns: repeat(2, 1fr); }
      .opt-icon svg { width: 44px; height: 44px; }
      .summary { grid-template-columns: repeat(3, 1fr); }
      .nav { max-width: 480px; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="alert"></div>
  <div class="wrap">
    <header class="hdr">
      <div class="hdr-banner">
        <svg class="hdr-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <!-- Banner SVG shortened for brevity -->
          <circle cx="256" cy="256" r="248" fill="#080c10"/>
        </svg>
        <div class="hdr-divider"></div>
        <div class="hdr-text">
          <div class="hdr-title"><span class="hdr-core">CORE</span><span class="hdr-builds"> BUILDS</span></div>
          <div class="hdr-underline"></div>
          <div class="hdr-by">BY BREVITY</div>
          <div class="hdr-sub">Template Configurator — AIOStreams</div>
        </div>
      </div>
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
        <div class="prog-label" id="pLabel">Step 1 of 7</div>
      </div>
    </header>
    
    <main id="main"></main>
    
    <nav class="nav" id="nav">
      <button class="btn btn-back" id="btnBack">← Back</button>
      <button class="btn btn-next" id="btnNext">Next →</button>
    </nav>
  </div>

  <script>
    const STEPS = 7;
    let step = 1;
    
    const S = { 
      service: null, device: null, resolution: null, audio: null, content: null, name: '', 
      multiServices: [], tmdbToken: '', tmdbApiKey: '', 
      creds: {torbox:'', realdebrid:'', alldebrid:'', premiumize:'', debridlink:''}, 
      instanceHost: 'elfhosted', instanceUrl: '', instanceUuid: '', instancePassword: '' 
    };

    // Note: DEFS Array content remains the same structure, simplified SVG paths for space here.
    const DEFS = [
      { id: 'service', title: 'Debrid Service', desc: 'Which service are you using for cached streams?', key: 'service', cols: 'c4d', layout: 'hero',
        opts: [
          { v: 'torbox-pro', icon: '<svg width="44" height="44"></svg>', name: 'TorBox Pro', desc: 'Best pick — full scraper stack + HdHub' },
          { v: 'realdebrid', icon: '<svg width="44" height="44"></svg>', name: 'Real-Debrid', desc: 'Real-Debrid subscribers' },
          // Additional items kept logically identical...
        ]
      },
      // ... Definitions for device, resolution, audio, content, apis, review omitted for brevity ...
      { id: 'review', title: 'Review & Download', desc: 'Confirm your settings and generate the template JSON.', key: null, cols: 'c2', opts: [] }
    ];

    function label(key, val) {
      const d = DEFS.find(x => x.key === key);
      if (!d) return val || '';
      const o = d?.opts?.find(x => x.v === val);
      return o ? o.name : val || '';
    }

    function renderOpts(def) {
      const key = def.key, id = def.id;
      // Refined to use data attributes instead of inline Javascript handlers
      const inp = (o) => `<input type="radio" name="${id}" id="o_${o.v}" value="${o.v}" ${S[key] === o.v ? 'checked' : ''} data-key="${key}" data-action="update-radio">`;
      const body = (o) => `<div class="opt-body"><div class="opt-name">${o.name}</div><div class="opt-desc">${o.desc}</div></div>`;
      const std = (o, cls = '') => `<div class="opt${cls}">${inp(o)}<label for="o_${o.v}"><div class="opt-icon">${o.icon}</div>${body(o)}</label></div>`;

      if (def.layout === 'list') return `<div class="opts list">${def.opts.map(o => std(o)).join('')}</div>`;
      if (def.layout === 'pills') return `<div class="opts pills">${def.opts.map(o => std(o)).join('')}</div>`;
      
      return `<div class="opts ${def.cols}">${def.opts.map(o => std(o)).join('')}</div>`;
    }

    function renderProgress() {
      const pct = ((step - 1) / (STEPS - 1)) * 100;
      document.getElementById('pFill').style.width = pct + '%';
      const titles = ['Service', 'Device', 'Resolution', 'Audio', 'Content', 'APIs', 'Review'];
      document.getElementById('pLabel').textContent = `Step ${step} of ${STEPS} · ${titles[step - 1] || ''}`;
    }

    function render() {
      renderProgress();
      const main = document.getElementById('main');
      const nav = document.getElementById('nav');
      const def = DEFS[step - 1] || DEFS[DEFS.length - 1]; // Fallback if missing data

      if (step === STEPS) {
        // Review UI rendering logic...
        main.innerHTML = `<section class="card">
          <h2>Your Configuration</h2>
          <p class="desc">Review your choices, optionally name your template, then download.</p>
          <div class="name-row">
            <label for="nameIn">Template name (optional)</label>
            <input class="name-input" id="nameIn" type="text" data-action="update-name" maxlength="60">
          </div>
          <button class="btn-dl" id="btnDownload">⬇ Generate &amp; Download Template</button>
        </section>`;
        nav.style.display = 'none';
      } else {
        main.innerHTML = `<section class="card">
          <h2>${def.title}</h2>
          <p class="desc">${def.desc}</p>
          ${renderOpts(def)}
        </section>`;
        nav.style.display = 'flex';
        document.getElementById('btnBack').style.visibility = step > 1 ? 'visible' : 'hidden';
      }
      syncNext();
    }

    function syncNext() {
      const def = DEFS[step - 1];
      if(!def) return;
      const btn = document.getElementById('btnNext');
      let ok = !def.key || !!S[def.key];
      btn.disabled = !ok;
    }

    // --- Cleaned Up Event Delegation --- //
    
    document.addEventListener('DOMContentLoaded', () => {
      // Main navigation
      document.getElementById('btnNext').addEventListener('click', () => {
        if (step < STEPS) { step++; render(); window.scrollTo(0,0); }
      });
      
      document.getElementById('btnBack').addEventListener('click', () => {
        if (step > 1) { step--; render(); window.scrollTo(0,0); }
      });

      // Handle generic form inputs dynamically
      document.addEventListener('change', (e) => {
        if (e.target.dataset.action === 'update-radio') {
          const key = e.target.dataset.key;
          S[key] = e.target.value;
          syncNext();
        }
      });
      
      document.addEventListener('input', (e) => {
        if (e.target.dataset.action === 'update-name') {
          S.name = e.target.value;
        }
      });
      
      // Download handler delegation
      document.addEventListener('click', (e) => {
        if (e.target.id === 'btnDownload') generate();
      });

      // Initial Render
      render();
    });

    // Template Generation Stubs
    function build() { return { metadata: { name: S.name || "Core Nexus Custom" } }; }
    
    function generate() {
      const tmpl = build();
      const json = JSON.stringify(tmpl, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; 
      a.download = 'template.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }
  </script>
</body>
</html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 20px}
.wrap{width:100%;max-width:700px;flex:1;display:flex;flex-direction:column}
.hdr{margin-bottom:8px}
.hdr-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#080c10 0%,#0a1018 100%);border:1px solid #1a2535;border-radius:16px;padding:16px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hdr-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,212,255,.06) 0%,transparent 60%);pointer-events:none}
.hdr-icon{width:46px;height:46px;flex-shrink:0;position:relative;z-index:1;filter:drop-shadow(0 0 8px rgba(0,212,255,.4))}
.hdr-divider{width:1px;height:44px;background:linear-gradient(to bottom,transparent,rgba(0,212,255,.5),transparent);flex-shrink:0;position:relative;z-index:1}
.hdr-text{position:relative;z-index:1;display:flex;flex-direction:column;gap:1px}
.hdr-title{font-size:1.55rem;font-weight:900;letter-spacing:-.02em;line-height:1;margin-bottom:2px}
.hdr-core{color:#fff}
.hdr-builds{color:#00d4ff}
.hdr-underline{height:1.5px;width:96px;background:linear-gradient(90deg,rgba(0,212,255,.55),transparent);border-radius:1px;margin-bottom:3px}
.hdr-by{font-size:.63rem;letter-spacing:.16em;color:#4b8fa8;margin-bottom:2px}
.hdr-sub{font-size:.78rem;color:#6b7280;line-height:1.3}
.prog-wrap{margin:0 0 6px}
.prog-track{background:#21262d;border-radius:4px;height:5px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,#0891b2,#00d4ff);height:100%;transition:width .35s ease;border-radius:4px}
.prog-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:5px}
.prog-label{color:#8b949e;font-size:.75rem;letter-spacing:.03em}
.btn-reset{background:none;border:none;color:#8b949e;font-size:.7rem;cursor:pointer;text-decoration:underline;padding:0;transition:color .15s}
.btn-reset:hover{color:#00d4ff}
.card{background:#0e1318;background-image:radial-gradient(ellipse at 12% 15%,rgba(0,180,210,.07) 0%,transparent 55%),radial-gradient(ellipse at 88% 85%,rgba(110,30,180,.05) 0%,transparent 55%);border:1px solid #1e2d3d;border-radius:14px;padding:28px;margin-bottom:14px;animation:slideInRight .22s ease;flex:1;display:flex;flex-direction:column}
#main.nav-back .card{animation-name:slideInBack}
#main{flex:1;display:flex;flex-direction:column}
.opts{align-content:start}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(13px)}to{opacity:1;transform:none}}
@keyframes slideInBack{from{opacity:0;transform:translateX(-13px)}to{opacity:1;transform:none}}
.card h2{font-size:1.15rem;font-weight:700;margin-bottom:5px}
.card .desc{color:#8b949e;font-size:.88rem;margin-bottom:20px;line-height:1.5}
.opts{display:grid;gap:10px}
.opts.c2{grid-template-columns:1fr 1fr}
.opts.c3{grid-template-columns:1fr 1fr}
.opts.c1{grid-template-columns:1fr}
.opts.c4d{grid-template-columns:1fr 1fr}
.opts.c3d{grid-template-columns:1fr}
.opts.c2d{grid-template-columns:1fr}
.opt input{display:none}
.opt label{display:flex;flex-direction:column;background:rgba(13,17,23,.7);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:15px 13px;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s;height:100%;user-select:none;position:relative}
.opt input:checked+label{border-color:rgba(0,212,255,.4);background:rgba(0,212,255,.06);box-shadow:0 0 0 1px rgba(0,212,255,.15),0 4px 20px rgba(0,150,180,.1)}
.opt input:checked+label::after{content:'✓';position:absolute;top:7px;right:7px;width:18px;height:18px;background:#00d4ff;color:#0d1117;border-radius:50%;font-size:.65rem;font-weight:900;display:grid;place-items:center}
.opt label:hover{border-color:rgba(0,212,255,.2);background:rgba(0,212,255,.03)}
.opt-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.opt-icon svg{width:42px;height:42px}
.opt-body{display:flex;flex-direction:column;flex:1;min-width:0}
.opt-name{font-weight:700;font-size:1rem;line-height:1.25}
.opt-desc{color:#8b949e;font-size:.84rem;margin-top:4px;line-height:1.45}
.opts.c3d .opt label,.opts.c2d .opt label{flex-direction:row;align-items:center;gap:12px;padding:14px}
.opts.c3d .opt-icon,.opts.c2d .opt-icon{margin-bottom:0}
.opts.c3d .opt-icon svg,.opts.c2d .opt-icon svg{width:30px;height:30px}
.name-row label{color:#8b949e;font-size:.82rem;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.name-input{width:100%;background:#0d1117;border:2px solid #30363d;border-radius:8px;color:#e6edf3;padding:12px 16px;font-size:1rem;transition:border-color .15s;outline:none}
.name-input:focus{border-color:#00d4ff}
.name-input::placeholder{color:#484f58}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.sum-item{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px}
.sum-lbl{color:#8b949e;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.sum-val{font-weight:700;font-size:.9rem;margin-top:3px;color:#e6edf3}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:8px;position:sticky;bottom:16px;z-index:10}
.nav::before{content:'';position:absolute;inset:-28px -16px 0;background:linear-gradient(to bottom,transparent,#0d1117 40%);pointer-events:none;z-index:-1}
.btn{border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-back{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)!important;color:#6b7280;font-size:.84rem;font-weight:700;padding:11px 18px;border-radius:11px;align-self:stretch;transition:all .15s;text-align:center;letter-spacing:.01em}
.btn-back:hover{background:rgba(255,255,255,.08);color:#9ca3af;border-color:rgba(255,255,255,.18)!important}
.btn-next{width:100%;background:linear-gradient(135deg,#005c7a 0%,#003a56 100%);color:#fff;border-radius:13px;padding:14px 18px;font-size:.95rem;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 24px rgba(0,150,180,.2),inset 0 1px 0 rgba(255,255,255,.07);text-align:left;transition:box-shadow .2s,transform .15s}
.btn-next:hover:not(:disabled){box-shadow:0 6px 28px rgba(0,150,180,.35),inset 0 1px 0 rgba(255,255,255,.1);transform:translateY(-1px)}
.btn-next:disabled{background:#111820;border:1px solid #1e2a35;color:#374151;box-shadow:none;cursor:not-allowed}
.cta-step-lbl{font-size:.62rem;font-weight:600;opacity:.6;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.cta-step-val{font-size:.95rem;font-weight:800;line-height:1}
.cta-arr{font-size:1.15rem;opacity:.75;flex-shrink:0}
.btn-dl{width:100%;padding:16px;font-size:1.08rem;font-weight:800;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#059669,#10b981);color:#fff;margin-top:16px;transition:opacity .15s,transform .1s}
.btn-dl:active{transform:scale(.98)}
.btn-dl:hover{opacity:.9}
.btn-aio{width:100%;padding:14px;font-size:1rem;font-weight:700;border-radius:10px;border:2px solid #0e7490;cursor:pointer;background:transparent;color:#00d4ff;margin-top:10px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-aio:hover{background:#00131c;border-color:#00d4ff}
.btn-aio:active{transform:scale(.98)}
.aio-section{margin-top:20px;border-top:1px solid #21262d;padding-top:18px}
.aio-section h3{font-size:.82rem;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.aio-fields{display:grid;gap:10px;margin-bottom:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0a2a1a;border:1px solid #2ea043;color:#3fb950;padding:12px 22px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#1a0a0a;border-color:#8b1a1a;color:#f87171}
.import-success{background:#061a0e;border:1px solid #2ea043;border-radius:10px;padding:16px;margin-top:12px;font-size:.85rem}
.import-success strong{color:#3fb950;display:block;margin-bottom:8px;font-size:.95rem}
.manifest-url{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;font-family:monospace;font-size:.78rem;color:#8b949e;word-break:break-all;margin-top:6px;cursor:pointer;transition:border-color .15s}
.manifest-url:hover{border-color:#00d4ff;color:#00d4ff}
.notice{background:#0d2317;border:1px solid #2ea043;border-radius:9px;padding:13px 16px;font-size:.83rem;color:#8b949e;margin-top:14px;line-height:1.5}
.inst-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.inst-chip{display:inline-flex;align-items:center;padding:5px 12px;background:#0d1117;border:1px solid #30363d;border-radius:20px;font-size:.76rem;color:#8b949e;text-decoration:none;transition:border-color .15s,color .15s;white-space:nowrap}
.inst-chip:hover{border-color:#00d4ff;color:#00d4ff}
.inst-chip-import{background:#001428;border-color:#0e7490;color:#00d4ff}
.inst-chip-import:hover{background:#002a50;border-color:#00d4ff;color:#7ee8ff}
.notice strong{color:#3fb950;display:block;margin-bottom:3px}
/* Size limit presets */
.size-btn{padding:7px 16px;border-radius:8px;border:1.5px solid #30363d;background:#0d1117;color:#8b949e;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s}
.size-btn:hover{border-color:#005c7a;color:#e6edf3}
.size-btn-active{border-color:#00d4ff!important;background:#00131c!important;color:#00d4ff!important}
/* List layout */
.opts.list{grid-template-columns:1fr}
.opts.list .opt label{flex-direction:row;align-items:center;gap:14px;padding:13px 16px;border-color:rgba(255,255,255,.1)}
.opts.list .opt-icon{margin-bottom:0}
.opts.list .opt-icon svg{width:28px;height:28px;filter:drop-shadow(0 0 5px rgba(255,255,255,.12))}
.opts.list .opt input:checked+label .opt-icon svg{filter:drop-shadow(0 0 10px rgba(0,212,255,.4))}
/* Pill layout */
.opts.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:transparent;border:none;padding:0}
.opts.pills .opt{flex:1}
.opts.pills .opt label{flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(8,12,18,.9);color:#6b7280;height:auto;text-align:center}
.opts.pills .opt label:hover{border-color:rgba(0,212,255,.2);background:rgba(0,212,255,.04);color:#e6edf3}
.opts.pills .opt input:checked+label{background:rgba(0,212,255,.08);color:#00d4ff;border-color:rgba(0,212,255,.4);box-shadow:0 0 0 1px rgba(0,212,255,.15),0 4px 20px rgba(0,150,180,.12)}
.opts.pills .opt-icon svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.1))}
.opts.pills .opt input:checked+label .opt-icon svg{filter:drop-shadow(0 0 12px rgba(0,212,255,.35))}
.opts.pills .opt-icon{margin-bottom:0}
.opts.pills .opt-icon svg{width:30px;height:30px}
.opts.pills .opt-body{align-items:center}
.opts.pills .opt-name{font-size:.97rem;text-align:center}
.opts.pills .opt-desc{font-size:.8rem;margin-top:3px;opacity:.85;text-align:center}
/* Hero layout */
.hero-wrap{display:flex;flex-direction:column;gap:8px}
.hero-hero .opt label{flex-direction:row;align-items:flex-start;gap:16px;padding:18px;border-radius:12px}
.hero-hero .opt-icon{margin-bottom:0;flex-shrink:0}
.hero-hero .opt-icon svg{width:44px;height:44px}
.hero-badge{display:inline-block;background:#003344;color:#00d4ff;font-size:.67rem;font-weight:700;letter-spacing:.07em;padding:3px 10px;border-radius:20px;margin-bottom:6px;text-transform:uppercase}
.hero-hero .opt-name{font-size:1rem;font-weight:800}
.hero-hero .opt-desc{font-size:.8rem}
.hero-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-sub .opt label{flex-direction:row;align-items:center;gap:10px;padding:12px;border-radius:9px}
.hero-sub .opt-icon{margin-bottom:0}
.hero-sub .opt-icon svg{width:24px;height:24px}
.hero-sub .opt-name{font-size:.84rem}
.hero-sub .opt-desc{font-size:.7rem;margin-top:2px}
/* Service vertical list layout (variant B) */
.svc-list{display:flex;flex-direction:column;gap:7px}
.svc-list-hero label{flex-direction:row!important;align-items:center!important;gap:12px!important;padding:11px 14px!important;border-radius:11px!important;background:rgba(13,17,23,.7)!important;border-color:rgba(255,255,255,.07)!important}
.svc-list-hero .opt-icon{margin-bottom:0!important;flex-shrink:0}
.svc-list-hero .opt-icon svg{width:28px!important;height:28px!important}
.svc-list-hero .opt-name{font-size:.86rem!important}
.svc-list-hero .opt-desc{font-size:.69rem!important;margin-top:1px!important}
.svc-list-hero .svc-hero-tags{display:none}
.svc-list-hero input:checked+label{flex-direction:row!important;align-items:flex-start!important;gap:14px!important;padding:14px 16px!important;border-radius:12px!important;background:rgba(0,212,255,.08)!important;border-color:rgba(0,212,255,.4)!important}
.svc-list-hero input:checked+label .opt-icon svg{width:36px!important;height:36px!important}
.svc-list-hero input:checked+label .svc-hero-tags{display:flex!important;flex-wrap:wrap;gap:4px;margin-top:7px}
.svc-list-hero input:checked+label .opt-name{font-size:.9rem!important}
.svc-list-hero input:checked+label .opt-desc{font-size:.8rem!important}
.svc-hero-badge{font-size:.58rem;font-weight:800;letter-spacing:.1em;color:#00d4ff;background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.22);border-radius:20px;padding:1px 8px;margin-left:7px;vertical-align:middle;white-space:nowrap}
.svc-hero-tags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.svc-hero-tag{font-size:.6rem;font-weight:600;background:rgba(255,255,255,.04);border:1px solid #1e2d3d;border-radius:8px;padding:2px 7px;color:#9ca3af}
.svc-list-row label{flex-direction:row!important;align-items:center!important;gap:12px!important;padding:11px 14px!important;border-radius:11px!important}
.svc-list-row .opt-icon{margin-bottom:0!important;flex-shrink:0}
.svc-list-row .opt-icon svg{width:28px!important;height:28px!important}
.svc-list-row .opt-name{font-size:.86rem!important}
.svc-list-row .opt-desc{font-size:.69rem!important;margin-top:1px!important}
.svc-list-arr{color:#374151;font-size:.9rem;flex-shrink:0;margin-left:auto;transition:color .15s}
.svc-list-row input:checked+label .svc-list-arr{color:#00d4ff}
@media(min-width:720px){
  .wrap{max-width:980px}
  .card{padding:36px}
  .card h2{font-size:1.3rem}
  .hdr-banner{padding:22px 32px;gap:22px}
  .hdr-icon{width:64px;height:64px}
  .hdr-divider{height:64px}
  .hdr-title{font-size:2.1rem}
  .hdr-underline{width:136px}
  .opts{gap:14px}
  .opts.c4d{grid-template-columns:repeat(4,1fr)}
  .opts.c3{grid-template-columns:repeat(3,1fr)}
  .opts.c3d{grid-template-columns:repeat(3,1fr)}
  .opts.c2d{grid-template-columns:repeat(2,1fr)}
  .opts.pills{grid-template-columns:repeat(4,1fr);gap:10px}
  .opts.pills .opt label{padding:18px 12px}
  .opts.pills .opt-icon svg{width:34px;height:34px}
  .opts.pills .opt-name{font-size:1rem}

/* Toggle switch */
.toggle-sw{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}

.toggle-track{position:absolute;cursor:pointer;inset:0;background:#30363d;border-radius:24px;transition:.15s}
.toggle-track::before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#e6edf3;border-radius:50%;transition:.15s}
.toggle-sw input:checked~.toggle-track{background:#00d4ff}
.toggle-sw input:checked~.toggle-track::before{transform:translateX(20px);background:#fff}
/* Version badge */
.ver-badge{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:4px;background:#00131c;border:1px solid #005c7a;color:#00d4ff;text-decoration:none;letter-spacing:.04em;vertical-align:middle;transition:all .15s}

@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#6b7280;cursor:pointer;font-size:1.5rem;line-height:1;padding:2px 8px;border-radius:6px;transition:color .15s}

.modal-success-icon{width:48px;height:48px;background:#061a0e;border:2px solid #2ea043;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.modal-title{font-size:1.18rem;font-weight:800;text-align:center;margin-bottom:4px}
.modal-sub{color:#6b7280;font-size:.8rem;text-align:center;margin-bottom:18px;line-height:1.5}
.fmt-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}

.copy-field{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.copy-field-label{color:#6b7280;font-size:.67rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.copy-field-val{font-family:monospace;font-size:.74rem;color:#c9d1d9;word-break:break-all}

.qr-wrap{display:flex;justify-content:center;margin:12px 0 3px}

.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.m-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:8px;font-weight:700;font-size:.88rem;cursor:pointer;border:none;text-decoration:none;transition:all .15s;white-space:nowrap;min-width:0}
.m-btn:active{transform:scale(.97)}
.m-install{background:linear-gradient(135deg,#0e7490,#00d4ff);color:#000}
.m-web{background:#1a1f2e;border:1.5px solid #00d4ff!important;color:#00d4ff}
.m-wu{background:#16103a;border:1.5px solid #4f46e5!important;color:#a78bfa}

/* Manifest primary button */
.btn-manifest{width:100%;padding:15px;font-size:1.05rem;font-weight:800;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#0e7490,#00d4ff);color:#000;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px}
.btn-manifest:hover{opacity:.88}
.btn-manifest:active{transform:scale(.98)}
.btn-manifest:disabled{opacity:.38;cursor:not-allowed}
/* Connecting dots animation */
@keyframes dotPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.dot-spin span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:currentColor;animation:dotPulse 1.2s ease-in-out infinite}
.dot-spin span:nth-child(2){animation-delay:.2s}
.dot-spin span:nth-child(3){animation-delay:.4s}
/* Duck-style preference toggle cards */
.pref-section{margin-bottom:20px}
.pref-section-label{font-size:.75rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}

.fmt-live-preview{background:#111827;border:1px solid #1e2837;border-radius:8px;padding:11px 13px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}

.fmt-live-d{font-size:.7rem;color:#6b7280;line-height:1.55;word-break:break-word}
/* Animated logo */
@keyframes corePulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.07);opacity:1}}
@keyframes coreGlowPulse{0%,100%{transform:scale(1);opacity:.38}50%{transform:scale(1.24);opacity:.84}}
@keyframes coreRingOut{0%{transform:scale(.5);opacity:.7}100%{transform:scale(2);opacity:0}}
@keyframes hexBreath{0%,100%{opacity:.28}50%{opacity:.5}}
@keyframes coreTextPulse{0%,100%{text-shadow:none}50%{text-shadow:0 0 14px rgba(255,255,255,.55),0 0 28px rgba(255,255,255,.18)}}
.diamond-core{transform-box:fill-box;transform-origin:center;animation:corePulse 2.6s ease-in-out infinite}
.diamond-glow{transform-box:fill-box;transform-origin:center;animation:coreGlowPulse 2.6s ease-in-out infinite}
.core-ring{transform-box:fill-box;transform-origin:center;fill:none;stroke-width:5;animation:coreRingOut 2.6s ease-out infinite}
.core-ring-2{animation-delay:1.3s}
.hex-glow-layer{animation:hexBreath 2.6s ease-in-out infinite}
.hdr-core{animation:coreTextPulse 2.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.diamond-core,.diamond-glow,.core-ring,.hex-glow-layer,.hdr-core{animation:none}}
.srh{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.05)}

.bc-row{display:flex;flex-wrap:nowrap;gap:5px;padding:1px 0 7px;overflow-x:auto;scrollbar-width:none}

/* STATE MANAGEMENT */
function saveState() {
  localStorage.setItem('coreBuild', JSON.stringify(S));
  localStorage.setItem('coreBuildStep', step);
}
function shareConfig() {
  try {
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const url = location.origin + location.pathname + '#cfg=' + encoded;
    navigator.clipboard.writeText(url).then(() => showToast('Share link copied — anyone with this link gets your exact settings'));
  } catch(e) { showToast('Failed to copy share link', true); }
}

function loadState() {
  try {
    const params = new URLSearchParams(location.search);
    if (params.has('fresh')) {
      localStorage.removeItem('coreBuild');
      localStorage.removeItem('coreBuildStep');
      history.replaceState(null, '', location.pathname + location.hash);
      return;
    }
    const hash = location.hash;
    if (hash.startsWith('#cfg=')) {
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(hash.slice(5)))));
        Object.assign(S, decoded);
        hadSavedState = true;
        S.service = deriveService();
        history.replaceState(null, '', location.pathname);
        return;
      } catch(e) { console.warn('Failed to load shared config', e); history.replaceState(null, '', location.pathname); setTimeout(() => showToast('Share link could not be loaded — it may be corrupted or from an older version', true), 300); }
    }
    const savedS = localStorage.getItem('coreBuild');
    const savedStep = localStorage.getItem('coreBuildStep');
    if (savedS) { Object.assign(S, JSON.parse(savedS)); hadSavedState = true; S.service = deriveService(); }
    if (savedStep) _savedStep = parseInt(savedStep, 10) || 0;
    // Always start at splash (step 0) so user can choose to continue or start fresh
  } catch (e) { console.warn("Failed to load state", e); }
}
function clearState() {
  localStorage.removeItem('coreBuild');
  localStorage.removeItem('coreBuildStep');

function deriveService() {
  const PRIMARY = ['torbox-pro','torbox-ess','alldebrid','realdebrid','premiumize','debridlink','easynews','offcloud','hybrid','debridio'];
  const primary = S.multiServices.filter(s => PRIMARY.includes(s));
  if (primary.length > 1) return 'multi';
  if (primary.length === 1) return primary[0];
  if (S.multiServices.includes('http')) return 'http';
  if (S.multiServices.includes('p2p')) return 'p2p';
  return null;
}

function label(key, val) {
  if (key === 'formatter') { const f = FORMATTERS.find(x => x.id === val); return f ? f.label : val || ''; }
  if (key === 'audio') { const m = {lossless:'Full Lossless',standard:'DD+ / Atmos',limited:'Auto',dolby:'Dolby Only'}; return m[val] || val || ''; }
  if (key === 'service' && val === 'multi') {
    const d2 = DEFS.find(x => x.key === 'service');
    if (d2) return S.multiServices.filter(s => ['torbox-pro','torbox-ess','alldebrid','realdebrid','premiumize','debridlink','easynews','offcloud','hybrid','debridio'].includes(s)).map(s => { const o = d2.opts.find(x => x.v === s); return o ? o.name : s; }).join(' + ');
  }
  const d = DEFS.find(x => x.key === key);
  if (!d) return val || '';
  const o = d.opts.find(x => x.v === val);
  return o ? o.name : val || '';
}

function renderProgress() {
  const progWrap = document.querySelector('.prog-wrap');
  const nav = document.getElementById('nav');
  if (step === 0) {
    if (progWrap) progWrap.style.display = 'none';
    if (nav) nav.style.display = 'none';
    return;
  }
  if (progWrap) progWrap.style.display = '';
  if (nav) nav.style.display = '';

  const keys  = ['service','device','resolution','audio','content',null];

  // Step bubble strip
  const bubbles = Array.from({length: STEPS}, (_, i) => {
    const n = i + 1;
    const state = n < step ? 'done' : n === step ? 'active' : 'pending';
    const tipName = DEFS[i] ? DEFS[i].title : (n === STEPS ? 'Review' : `Step ${n}`);
    return `<div class="step-unit ${state}" title="${tipName}"><div class="step-bub">${state==='done'?'✓':''}</div></div>`;
  }).join('');

  const strip = document.getElementById('stepStrip');
  if (strip) strip.innerHTML = `<div class="step-strip">${bubbles}<button class="btn-reset-strip" data-action="reset-state" title="Start over from scratch">↺ Start Over</button></div>`;

  // Breadcrumb chips — show completed selections
  const chips = keys.slice(0, step - 1).map((k, i) => {
    if (!k || !S[k]) return '';
    const lbl = label(k, S[k]);
    return lbl ? `<span class="bc-chip">✓ ${lbl}</span>` : '';
  }).filter(Boolean);

  const bc = document.getElementById('breadcrumbs');
  if (bc) bc.innerHTML = chips.length ? `<div class="bc-row">${chips.join('')}</div>` : '';
}

function render() {
  renderProgress();
  const main = document.getElementById('main');
  const nav  = document.getElementById('nav');

  if (step === 0) {
    main.innerHTML = splashHtml();
    main.style.justifyContent = 'center';
    return;
  }
  main.style.justifyContent = '';

  if (showAdvanced) {
    main.innerHTML = renderAdvancedPanel();
    nav.style.display = 'none';
    return;
  }

  const def  = DEFS[step - 1];

  if (step === STEPS) {
    if (!S.name) { S.name = defaultName(); saveState(); }
    const auto = S.name;
    const hasApis = S.tmdbToken || S.tmdbApiKey || Object.values(S.creds).some(v=>v);
    main.innerHTML = `

  } else {

        ${def.id === 'content' ? renderCacheMode() + renderMatchMode() + renderP2pToggle() : ''}
        ${def.id === 'content' ? `<button data-action="skip-content" style="width:100%;margin-top:10px;padding:9px 14px;background:transparent;border:1px dashed rgba(255,255,255,.1);border-radius:10px;color:#4b5563;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.02em" onmouseover="this.style.color='#6b7280';this.style.borderColor='rgba(255,255,255,.2)'" onmouseout="this.style.color='#4b5563';this.style.borderColor='rgba(255,255,255,.1)'">Skip — use Everything (safe default) →</button>` : ''}

    if (step > 1) {
      const prevTitle = step === 2 ? 'Service' : (DEFS[step-2]?.title || 'Back');

}

function syncNext() {
  const def = DEFS[step - 1];
  const btn = document.getElementById('btnNext');
  btn.style.display = '';
  let ok = !def.key || !!S[def.key];
  if (step === 1) ok = S.multiServices.length > 0;
  if (!btn) return;
  btn.disabled = !ok;
  const nextDef = step < STEPS ? DEFS[step] : null;
  const nextLabel = nextDef ? nextDef.title : null;
  if (step === STEPS) {
    btn.innerHTML = `<span style="flex:1">Review &amp; Generate</span><span class="cta-arr">→</span>`;
  } else if (ok && nextLabel) {
    btn.innerHTML = `<div style="flex:1"><div class="cta-step-lbl" style="font-size:.64rem;font-weight:700;color:#374151;letter-spacing:.07em;text-transform:uppercase;margin-bottom:1px">Next</div><div class="cta-step-val" style="font-size:.9rem;font-weight:800">${nextLabel}</div></div><span class="cta-arr">→</span>`;
  } else if (!def.key) {
    btn.innerHTML = `<span style="flex:1;font-size:.92rem;font-weight:700">Continue</span><span class="cta-arr">→</span>`;
  } else {
    btn.innerHTML = `<span style="flex:1;font-size:.88rem;font-weight:600;opacity:.5">Select one to continue</span><span class="cta-arr" style="opacity:.3">→</span>`;
  }
}

function updateMultiPanel() {
  const panel = document.getElementById('multiPanel');
  if (!panel) return;
  if (S.service !== 'multi') { panel.style.display = 'none'; syncNext(); return; }
  panel.style.display = '';
  const multiOpts = [
    { v:'alldebrid',  label:'AllDebrid',   color:'#ea580c' },
    { v:'realdebrid', label:'Real-Debrid', color:'#dc2626' },
    { v:'premiumize', label:'Premiumize',  color:'#d97706' },
    { v:'debridlink', label:'Debrid-Link', color:'#0284c7' },
    { v:'offcloud',   label:'Offcloud',    color:'#06b6d4' },
    { v:'easynews',   label:'EasyNews',    color:'#0ea5e9' },
  ];
  panel.innerHTML = `
    <div style="border-top:1px solid #30363d;padding-top:14px;margin-top:4px">
      <div style="color:#8b949e;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Select your services</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${multiOpts.map(m => `
          <label style="display:flex;align-items:center;gap:10px;background:#0d1117;border:2px solid ${S.multiServices.includes(m.v) ? m.color : '#30363d'};border-radius:8px;padding:12px;cursor:pointer;user-select:none;transition:border-color .15s">
            <input type="checkbox" data-action="toggle-multi" value="${m.v}" ${S.multiServices.includes(m.v) ? 'checked' : ''}>
            <span style="font-weight:700;font-size:.9rem;color:${S.multiServices.includes(m.v) ? m.color : '#e6edf3'}">${m.label}</span>
          </label>`).join('')}
      </div>
    </div>`;
  syncNext();
}

/* DELEGATED EVENTS */
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  if (!hadSavedState && S.resolution === null) {
    try {
      const px = (screen.width || 0) * (window.devicePixelRatio || 1);
      if (px >= 3840) S.resolution = '4k';
    } catch(e) {}
  }
  render();

  // Keyboard shortcuts: Enter = next, Escape = back
  document.addEventListener('keydown', (e) => {
    if (step === 0) return;
    if (document.getElementById('manifestModal') || document.getElementById('advModal')) return;
    const tag = document.activeElement?.tagName;
    const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement?.isContentEditable;
    if (e.key === 'Enter' && !inInput && !e.shiftKey) {
      e.preventDefault();
      const btn = document.getElementById('btnNext');
      if (btn && !btn.disabled && btn.style.display !== 'none') btn.click();
    }
    if (e.key === 'Escape' && !inInput) {
      const btn = document.getElementById('btnBack');
      if (btn && btn.style.visibility !== 'hidden') btn.click();
    }
  });

  // Handle all clicks
  document.addEventListener('click', (e) => {
    const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
    if(!action) return;

    if (action === 'nav-next') {
      if (step === 1 && S.multiServices.length === 0) return;
      if (DEFS[step-1].key && !S[DEFS[step-1].key] && step !== 1) return;
      if (step < STEPS) {
        document.getElementById('main').classList.remove('nav-back');
        step = (step === 1 && S.quickStart) ? 5 : step + 1;
        saveState(); render(); window.scrollTo(0,0);
      }
    }
    if (action === 'nav-back') {
      if (step > 0) {
        document.getElementById('main').classList.add('nav-back');
        step = (step === 5 && S.quickStart) ? 1 : step - 1;
        saveState(); render(); window.scrollTo(0,0);
      }
    }
    if (action === 'skip-device') {
      S.device = 'generic';
      document.getElementById('main').classList.remove('nav-back');
      step = (step === 1 && S.quickStart) ? 5 : step + 1;
      saveState(); render(); window.scrollTo(0,0);
    }
    if (action === 'skip-content') {
      S.content = 'all';
      document.getElementById('main').classList.remove('nav-back');
      step = (step === 1 && S.quickStart) ? 5 : step + 1;
      saveState(); render(); window.scrollTo(0,0);
    }
    if (action === 'quick-start') {
      const preset = (e.target.closest('[data-preset]') || e.target).dataset.preset;
      if (preset === '1080p') Object.assign(S, { resolution:'1080p', audio:'standard', content:'all', formatter:'apex-v2', matchMode:'balanced', p2pEnabled:false, quickStart:true });
      else Object.assign(S, { resolution:'4k', audio:'lossless', content:'all', formatter:'apex-v2', matchMode:'balanced', p2pEnabled:false, quickStart:true });
      saveState(); document.getElementById('main').classList.remove('nav-back');
      step = 1; render(); window.scrollTo(0,0);
    }
    if (action === 'open-advanced')  { showAdvanced = true;  render(); window.scrollTo(0,0); }
    if (action === 'close-advanced') { showAdvanced = false; render(); window.scrollTo(0,0); }
    if (action === 'start-setup') { S.quickStart = false; document.getElementById('main').classList.remove('nav-back'); step = 1; saveState(); render(); window.scrollTo(0,0); }
    if (action === 'continue-session') { step = _savedStep || 1; saveState(); render(); window.scrollTo(0,0); }
    if (action === 'start-fresh') { clearState(); }
    if (action === 'paste-manifest-splash') { document.getElementById('main').classList.remove('nav-back'); step = STEPS; pasteMode = true; saveState(); render(); window.scrollTo(0,0); }
    if (action === 'reset-state') { showAdvanced = false; clearState(); }
    if (action === 'share-config') shareConfig();
    if (action === 'generate-dl') generate();
    if (action === 'create-import') createImportUrl();
    if (action === 'gen-pwd') genPwd();
    if (action === 'toggle-pwd') togglePwd();
    if (action === 'install-stremio') openInAIOStreams();
    if (action === 'copy-manifest') {
      const url = e.target.dataset.url || e.target.closest('[data-url]')?.dataset.url;
      navigator.clipboard.writeText(url).then(() => showToast('Manifest URL copied'));
    }
    if (action === 'copy-wuplay') {
      const url = e.target.dataset.url || e.target.closest('[data-action="copy-wuplay"]')?.dataset.url;
      navigator.clipboard.writeText(url).then(() => showToast('Copied! Paste into WuPlay configurer → Addons'));
    }
    if (action === 'toggle-pref') {
      const key = (e.target.closest('[data-action="toggle-pref"]') || e.target).dataset.key;
      if (key && key in S) { S[key] = !S[key]; saveState(); render(); }
    }
    if (action === 'set-size-limit') {
      S.sizeLimit = (e.target.closest('[data-action]') || e.target).dataset.val;
      saveState();
      document.querySelectorAll('[data-action="set-size-limit"]').forEach(b => {
        b.classList.toggle('size-btn-active', b.dataset.val === S.sizeLimit);
      });
    }
    if (action === 'set-cache-mode') {
      S.cacheMode = (e.target.closest('[data-action="set-cache-mode"]') || e.target).dataset.val;
      saveState();
      document.querySelectorAll('[data-action="set-cache-mode"]').forEach(btn => {
        const on = btn.dataset.val === S.cacheMode;
        btn.style.borderColor = on ? 'rgba(0,212,255,.4)' : 'rgba(255,255,255,.07)';
        btn.style.background  = on ? 'rgba(0,212,255,.1)' : 'transparent';
        btn.style.color       = on ? '#00d4ff' : '#6b7280';
        btn.style.fontWeight  = on ? '700' : '500';
      });
    }
    if (action === 'set-match-mode') {
      S.matchMode = (e.target.closest('[data-action="set-match-mode"]') || e.target).dataset.val;
      if (S.matchMode === 'strict') S.qualityFirst = true;
      else S.qualityFirst = false;
      saveState();
      document.querySelectorAll('[data-action="set-match-mode"]').forEach(btn => {
        const on = btn.dataset.val === S.matchMode;
        btn.style.borderColor = on ? 'rgba(0,212,255,.4)' : 'rgba(255,255,255,.07)';
        btn.style.background  = on ? 'rgba(0,212,255,.1)' : 'transparent';
        btn.style.color       = on ? '#00d4ff' : '#6b7280';
        btn.style.fontWeight  = on ? '700' : '500';
      });
    }
    if (action === 'set-audio') {
      S.audio = (e.target.closest('[data-action="set-audio"]') || e.target).dataset.val;
      saveState();
      document.querySelectorAll('[data-action="set-audio"]').forEach(row => {
        const on = row.dataset.val === S.audio;
        row.style.borderColor = on ? 'rgba(0,212,255,.35)' : 'rgba(255,255,255,.07)';
        row.style.background  = on ? 'rgba(0,212,255,.05)' : 'rgba(13,17,23,.7)';
        const nm = row.querySelector('.opt-name');
        if (nm) nm.style.color = on ? '#00d4ff' : '#e6edf3';
        const arr = row.querySelector('span:last-child');
        if (arr) { arr.textContent = on ? '✓' : '›'; arr.style.color = on ? '#00d4ff' : '#374151'; }
      });
      const sum = document.querySelector('.adv-audio-details summary span:last-child');
      const AUDIO_LABELS = { lossless:'Full Lossless', standard:'DD+ / Atmos', limited:'Auto', dolby:'Dolby Only' };
      if (sum) sum.textContent = (AUDIO_LABELS[S.audio] || 'Auto') + ' ›';
    }
    if (action === 'set-formatter') {
      S.formatter = (e.target.closest('[data-action="set-formatter"]') || e.target).dataset.val;
      saveState();
      document.querySelectorAll('[data-action="set-formatter"]').forEach(card => {
        const on = card.dataset.val === S.formatter;
        card.style.borderColor = on ? 'rgba(0,212,255,.4)' : 'rgba(255,255,255,.1)';
        card.style.background  = on ? 'rgba(0,212,255,.07)' : 'rgba(8,12,18,.9)';
        card.style.boxShadow   = on ? '0 0 0 3px rgba(0,212,255,.1)' : 'none';
        const lbl = card.querySelector('.fmt-lbl');
        if (lbl) lbl.style.color = on ? '#00d4ff' : '#e6edf3';
        const pw = card.querySelector('.fmt-preview-wrap');
        if (pw) pw.style.display = on ? '' : 'none';
        const arr = card.querySelector('[style*="flex-shrink:0"]');
        if (arr && (arr.textContent === '✓' || arr.textContent === '›')) arr.textContent = on ? '✓' : '›';
      });
      // Update the receipt row and summary label in-place when on Review step
      const fmtLbl = label('formatter', S.formatter);
      const fmtSummary = document.querySelector('#fmtPickerDetails > summary span:first-child');
      if (fmtSummary) fmtSummary.innerHTML = `<span>🎨</span> Stream Formatter <span style="font-weight:600;color:#374151;text-transform:none;letter-spacing:0;font-size:.72rem">— ${fmtLbl}</span>`;
      const receiptRows = document.querySelectorAll('.receipt-row');
      receiptRows.forEach(row => {
        const lbl2 = row.querySelector('.receipt-row-lbl');
        if (lbl2 && lbl2.textContent.trim() === 'formatter') {
          const val = row.querySelector('.receipt-row-val');
          if (val) { val.textContent = fmtLbl; val.className = `receipt-row-val${S.formatter !== 'apex-v2' ? ' hl' : ''}`; }
        }
      });
    }
  });

  // Handle inputs and changes
  document.addEventListener('change', (e) => {
    if (e.target.dataset.action === 'update-radio') {
      S[e.target.dataset.key] = e.target.value;
      if (e.target.dataset.key === 'device') {
        const DEV_AUDIO = { samsung:'standard', 'firestick-hd':'limited', 'firestick-4kmax':'limited', shield:'standard', lgtv:'lossless', 'appletv-old':'lossless', 'appletv-new':'lossless', windows:'lossless', generic:'lossless' };
        const AUDIO_NAMES = { lossless:'Lossless (TrueHD / DTS-HD)', standard:'DD+ / Atmos', limited:'Auto', dolby:'Dolby Only' };
        const newAudio = DEV_AUDIO[e.target.value];
        if (newAudio && newAudio !== S.audio) {
          S.audio = newAudio;
          showToast(`Audio auto-set to ${AUDIO_NAMES[newAudio] || newAudio}`);
        }
      }
      saveState();
      syncNext();
    }
    if (e.target.dataset.action === 'toggle-p2p') {
      S.p2pEnabled = e.target.checked;
      saveState();
    }
    if (e.target.dataset.action === 'toggle-service') {
      const val = e.target.value;
      const i = S.multiServices.indexOf(val);
      if (i >= 0) S.multiServices.splice(i, 1);
      else S.multiServices.push(val);
      S.service = deriveService();
      saveState();
      syncNext();
    }
    if (e.target.dataset.action === 'toggle-lang') {
      const v = e.target.value;
      const i = S.langs.indexOf(v);
      if (i >= 0) { if (S.langs.length > 1) S.langs.splice(i, 1); }
      else S.langs.push(v);
      saveState();
      const wasOpen = document.getElementById('langDetails')?.open;
      render();
      if (wasOpen) { const d = document.getElementById('langDetails'); if (d) d.open = true; }
    }
    if (e.target.dataset.action === 'toggle-lang-exclusive') {
      S.langExclusive = e.target.checked;
      saveState();
      const wasOpen = document.getElementById('langDetails')?.open;
      render();
      if (wasOpen) { const d = document.getElementById('langDetails'); if (d) d.open = true; }
    }
    if (e.target.dataset.action === 'update-host') {
      S.instanceHost = e.target.value;
      saveState();
      const val = S.instanceHost;
      const urlRow  = document.getElementById('aioUrlRow');
      const uuidRow = document.getElementById('aioUuidRow');
      const cfgLinkRow = document.getElementById('hostConfigLinkRow');
      const cfgLink = document.getElementById('hostConfigLink');
      const showUuid = (val !== 'custom' && val !== 'auto');
      if (urlRow)  urlRow.style.display  = (val === 'custom') ? '' : 'none';
      if (uuidRow) uuidRow.style.display = showUuid ? '' : 'none';
      if (cfgLinkRow) cfgLinkRow.style.display = showUuid ? '' : 'none';
      if (cfgLink && HOST_BASE_URLS[val]) cfgLink.href = HOST_BASE_URLS[val] + '/configure';
      if (val === 'custom') { S.instanceUrl = ''; document.getElementById('aioUrl').value = ''; }
      document.getElementById('aioResult').innerHTML = '';
      if (showUuid) updateUuidValidation(S.instanceUuid); else updateUuidValidation('');
    }
  });

  document.addEventListener('input', (e) => {
    const a = e.target.dataset.action;
    if (a === 'update-name') S.name = e.target.value;
    else if (a === 'update-cred') S.creds[e.target.dataset.service] = e.target.value;
    else if (a === 'update-tmdb') S.tmdbToken = e.target.value;
    else if (a === 'update-tmdb-key') S.tmdbApiKey = e.target.value;
    else if (a === 'update-url') S.instanceUrl = e.target.value.trim();
    else if (a === 'update-pwd') S.instancePassword = e.target.value;
    else if (a === 'update-uuid') {
      const raw = e.target.value.trim();
      const extracted = extractManifestParts(raw);

function insights() {

  if (dev === 'samsung') pts.push('<b>DV-Only Kill</b> — blocks DV streams missing HDR10 fallback (prevents purple screen)');
  else if (dev === 'firestick-hd') pts.push('<b>DV-Only Kill</b> on · AV1 excluded · limited audio (DD+ max)');
  else if (dev === 'shield') pts.push('<b>AV1 + HLG excluded</b> — prevents Nvidia Shield playback failures');
  else if (dev === 'appletv-old') pts.push('<b>AV1 excluded</b> — Apple TV 4K Gen 1/2 hardware limit');
  else if (dev === 'appletv-new') pts.push('<b>Full AV1 + DV</b> — optimised for Apple TV 4K Gen 3 (A15)');
  else if (dev === 'windows') pts.push('<b>Full lossless + AV1</b> — Windows PC optimised, HDR-first visual tags');
  else if (dev === 'lgtv') pts.push('<b>Full DV + eARC + 7.1</b> — best-case LG webOS profile');
  if (aud === 'dolby') pts.push('<b>All DTS excluded</b> — safe for Bose / Dolby soundbars (Atmos · TrueHD · DD+ only)');
  else if (aud === 'lossless') pts.push('<b>Full lossless audio ranked</b> — TrueHD · Atmos · DTS-HD MA · FLAC prioritised');
  else if (aud === 'standard') pts.push('<b>DD+ / Atmos ranked</b> — soundbar and smart TV profile');
  if (cnt === 'anime') pts.push('<b>SeaDex Best-Only</b> — only the confirmed best release group per title');
  else if (cnt === 'mixed') pts.push('<b>SeaDex + live-action</b> scrapers active simultaneously');
  else if (cnt === 'live') pts.push('<b>Anime scrapers off</b> — leaner fetch stack for Movies &amp; TV');
  if (svc === 'hybrid') pts.push('<b>TorBox + Real-Debrid fallback</b> — widest cache coverage');
  else if (svc === 'torbox-pro') pts.push('<b>Full scraper stack</b> — Meteor · Comet · MediaFusion · HdHub · Zilean');
  if (!S.p2pEnabled) pts.push('<b>Raw torrents excluded</b> — direct P2P streams blocked; debrid results unaffected');
  if (S.qualityFirst) pts.push('<b>Quality over resolution</b> — REMUX ranked above resolution in sort order');
  if (S.exclude4K) pts.push('<b>4K / UHD excluded</b> — 1080p and below only');

    const resEl    = document.getElementById('stremioInstallResult');
    const btn      = document.getElementById('stremioInstallBtn');
    if (!email || !password) { resEl.innerHTML = `<span style="color:#f87171">Enter your Stremio email and password.</span>`; return; }
    btn.disabled = true; btn.textContent = 'Signing in…'; resEl.innerHTML = '';
    try {
      const SAPI = 'https://api.strem.io/api/';
      const loginRes = await fetch(SAPI, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type:'Login', email, password, facebook:false }) });
      const loginData = await loginRes.json();
      const authKey = loginData?.result?.authKey;
      if (!authKey) throw new Error(loginData?.error || 'Login failed — check your email and password.');
      btn.textContent = 'Installing…';
      const getRes = await fetch(SAPI, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type:'AddonCollectionGet', authKey, update:true }) });
      const getData = await getRes.json();
      if (!getData?.result?.addons) throw new Error(getData?.error || 'Could not fetch your addon list.');
      const existing = getData.result.addons;
      const already = existing.some(a => a.transportUrl === manifestUrl);
      if (!already) {
        const updated = [...existing, { transportName:'http', transportUrl: manifestUrl, flags:{} }];
        const setRes = await fetch(SAPI, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type:'AddonCollectionSet', authKey, addons: updated }) });
        const setData = await setRes.json();
        if (!setData?.result) throw new Error(setData?.error || 'Install failed.');
      }
      btn.textContent = '✓ Installed!'; btn.style.borderColor = 'rgba(63,185,80,.4)'; btn.style.color = '#3fb950'; btn.style.background = 'rgba(63,185,80,.07)';
      resEl.innerHTML = already ? `<span style="color:#f59e0b">Already in your library.</span>` : `<span style="color:#3fb950">Done — reopen Stremio to see it.</span>`;
    } catch(err) {
      btn.disabled = false; btn.textContent = '📥 Log in &amp; Install';
      resEl.innerHTML = `<span style="color:#f87171">${err.message}</span>`;
    }
  });
}

function showToast(msg, isError) {
  const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast' + (isError ? ' error' : '') + ' show';
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.className = 'toast' + (isError ? ' error' : ''); }, 3200);
}

function togglePwd() {
  const el = document.getElementById('aioPwd'), eye = document.getElementById('pwdEye');
  if (!el) return;
  const show = el.type === 'password'; el.type = show ? 'text' : 'password';
  if (eye) eye.style.color = show ? '#00d4ff' : '#4b5563';
}

function genPwd() {
  const PWD_WORDS = ['Blue','Red','Dark','Bright','Swift','Deep','High','Storm','Wild','Sharp','Iron','Gold','Stone','Silver','Flash','Frost','Fire','Wind','Thunder','Star','River','Forest','Ocean','Mountain','Canyon','Desert','Arctic','Ember','Shadow','Crystal','Falcon','Tiger','Wolf','Eagle','Phoenix','Dragon','Hawk','Raven','Cobra','Viper'];
  const arr = new Uint8Array(4); crypto.getRandomValues(arr);
  const pwd = `${PWD_WORDS[arr[0] % PWD_WORDS.length]}${PWD_WORDS[arr[1] % PWD_WORDS.length]}${PWD_WORDS[arr[2] % PWD_WORDS.length]}${String(100 + (arr[3] % 900))}`;
  S.instancePassword = pwd; saveState();
  const el = document.getElementById('aioPwd'); if (el) { el.value = pwd; el.type = 'text'; }
  showToast('Password generated — copy it now');
  setTimeout(() => { const e = document.getElementById('aioPwd'); if (e) e.type = 'password'; }, 5000);
}

function extractManifestParts(val) {
  if (!val || !val.includes('/stremio/')) return null;
  try {
    const u = new URL(val);
    const parts = u.pathname.split('/').filter(Boolean);
    const stremioIdx = parts.indexOf('stremio');
    if (stremioIdx === -1 || parts.length < stremioIdx + 2) return null;
    const uuid = parts[stremioIdx + 1];
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uuid)) return null;
    const rawPwd = parts.length > stremioIdx + 2 ? parts[stremioIdx + 2] : '';
    const password = (rawPwd && rawPwd !== 'manifest.json') ? decodeURIComponent(rawPwd) : '';
    const origin = u.origin;
    const hostKey = Object.keys(HOST_BASE_URLS).find(k => HOST_BASE_URLS[k] === origin) || null;
    return { uuid, password, hostKey };
  } catch(e) { return null; }
}

function validateUuid(val) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(val || '');
}

function updateUuidValidation(val) {
  const input = document.getElementById('aioUuid');
  const status = document.getElementById('uuidStatus');
  if (!input || !status) return;
  if (!val) { input.style.borderColor = ''; status.innerHTML = ''; return; }
  const ok = validateUuid(val);
  input.style.borderColor = ok ? '#22c55e' : '#f87171';
  status.innerHTML = ok
    ? '<span style="color:#22c55e;font-weight:700">✓ Valid UUID — Saved</span>'
    : '<span style="color:#f87171">Invalid format — must be xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx</span>';
}

function onPasteManifest(val) {
  val = (val || '').trim();
  const result = document.getElementById('pasteManifestResult');
  if (!val) { result.innerHTML = ''; return; }
  try { new URL(val); } catch(e) { result.innerHTML = ''; return; }
  result.innerHTML = '';
  const extracted = extractManifestParts(val);
  if (extracted) {
    if (extracted.uuid && !S.instanceUuid) { S.instanceUuid = extracted.uuid; saveState(); const uel=document.getElementById('aioUuid'); if(uel)uel.value=extracted.uuid; updateUuidValidation(extracted.uuid); }
    if (extracted.hostKey && S.instanceHost !== extracted.hostKey) { S.instanceHost = extracted.hostKey; saveState(); const sel=document.getElementById('aioHost'); if(sel)sel.value=extracted.hostKey; const uuidRow=document.getElementById('aioUuidRow'),cfgLinkRow=document.getElementById('hostConfigLinkRow'),cfgLink=document.getElementById('hostConfigLink'); if(uuidRow)uuidRow.style.display=''; if(cfgLinkRow)cfgLinkRow.style.display=''; if(cfgLink&&HOST_BASE_URLS[extracted.hostKey])cfgLink.href=HOST_BASE_URLS[extracted.hostKey]+'/configure'; }
    if (extracted.password && !S.instancePassword) { S.instancePassword = extracted.password; saveState(); const pe=document.getElementById('aioPwd'); if(pe)pe.value=extracted.password; }
  }
  showManifestModal(val, null, null);
}

function wuplayBtn(manifestUrl) {
  const safe = (manifestUrl||'').replace(/"/g,'&quot;');
  return `<button type="button" data-action="copy-wuplay" data-url="${safe}" title="Copy manifest URL — paste into WuPlay → Addons → Add Addon" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:8px;font-weight:700;font-size:.88rem;cursor:pointer;border:1px solid #4f46e5;background:#16103a;color:#a78bfa;transition:all .15s"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>WuPlay</button>`;
}

function instanceChips(templateUrl) {
  const hosts = [['ElfHosted','https://aiostreams.elfhosted.com/stremio/configure'],['ForthWeak','https://aiostreams.fortheweak.cloud/stremio/configure'],["Midnight's",'https://aiostreamsfortheweebsstable.midnightignite.me/stremio/configure'],["Viren's",'https://aiostreams.viren070.me/stremio/configure'],["Kuu's",'https://aiostreams.stremio.ru/stremio/configure'],['ATBP','https://aio.atbphosting.com/stremio/configure'],["Omni's",'https://aiostreams.12312023.xyz/stremio/configure']];
  return `<div class="inst-chips">${hosts.map(([n,u])=>`<a href="${u}${templateUrl?`?template=${encodeURIComponent(templateUrl)}`:''}" target="_blank" class="inst-chip ${templateUrl?'inst-chip-import':''}">${templateUrl?'▶ ':''}${n}</a>`).join('')}</div>`;
}

async function fetchWithTimeout(url, options = {}, timeout = 6000) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  const response = await fetch(url, { ...options, signal: controller.signal });
  clearTimeout(id);
  return response;
}

async function createImportUrl() {
  const btn = document.getElementById('btnImport'), result = document.getElementById('importUrlResult'), origHtml = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Creating…'; result.innerHTML = '';
  const tmpl = build();
  if (tmpl.config) {
    if (tmpl.config.services) tmpl.config.services = tmpl.config.services.map(s => ({ ...s, credentials: {} }));
  }
  const json = JSON.stringify(tmpl, null, 2);
  let url = null;
  
  // Paste API with Timeout
  try {
    const r = await fetchWithTimeout('https://paste.rs/', { method:'POST', headers:{'Content-Type':'text/plain'}, body:json }, 5000);
    if (r.ok) url = (await r.text()).trim();
  } catch(e) { console.warn("paste.rs failed/timed out", e); }

  if (!url) {
    try {
      const r = await fetchWithTimeout('https://dpaste.com/api/v2/', { method:'POST', body:new URLSearchParams({ content:json, syntax:'json', expiry_days:'365' }) }, 5000);
      if (r.ok) { const t=(await r.text()).trim().replace(/"/g,''); url = t.startsWith('http') ? t+'.txt' : null; }
    } catch(e) { console.warn("dpaste failed/timed out", e); }
  }

  btn.disabled = false; btn.innerHTML = origHtml;

  if (url) {
    navigator.clipboard.writeText(url).catch(()=>{});
    result.innerHTML = `<div class="import-success" style="margin-top:10px"><strong>▶ Click your instance to auto-import</strong><div style="color:#6b7280;font-size:.79rem;margin:4px 0 8px">Opens AIOStreams with your template pre-loaded. Debrid credentials stripped for security — TMDB keys are included.</div>${instanceChips(url)}<div style="color:#4b5563;font-size:.74rem;margin:8px 0 4px">Or copy the URL to import manually:</div><div style="display:flex;gap:6px;align-items:stretch"><div class="manifest-url" style="flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" data-action="copy-manifest" data-url="${url.replace(/"/g,'&quot;')}" title="Click to copy">${url}</div><button data-action="copy-manifest" data-url="${url.replace(/"/g,'&quot;')}" style="flex-shrink:0;padding:0 12px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.28);border-radius:6px;color:#00d4ff;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s" onmouseover="this.style.background='rgba(0,212,255,.2)'" onmouseout="this.style.background='rgba(0,212,255,.1)'">Copy</button></div></div>`;
    showToast('Click an instance chip to auto-import your template');
  } else {
    result.innerHTML = `<div class="import-success" style="border-color:#4b1a1a;background:#1a0606;margin-top:10px"><strong style="color:#f87171">Paste service blocked or timed out</strong><div style="color:#6b7280;font-size:.79rem;margin-top:4px">Your browser's security blocked the cross-origin request. Use ⬇ Download instead, then import the file in AIOStreams.</div></div>`;
    showToast('Paste service unreachable', true);
  }
}

async function openInAIOStreams() {
  const HOST_URLS = HOST_BASE_URLS;
  const HOST_LABELS = { 'https://aiostreams.elfhosted.com':'ElfHosted', 'https://aiostreams.fortheweak.cloud':'ForthWeak', 'https://aiostreamsfortheweebsstable.midnightignite.me':"Midnight's", 'https://aiostreams.viren070.me':"Viren's", 'https://aiostreams.stremio.ru':"Kuu's", 'https://aio.atbphosting.com':'ATBP', 'https://aiostreams.12312023.xyz':"Omni's" };
  const isAuto = S.instanceHost === 'auto', isCustom = S.instanceHost === 'custom';
  const base = HOST_URLS[S.instanceHost] || (S.instanceUrl || '').trim().replace(/\/$/, '');

  if (!isAuto && !base) { showToast('Enter your AIOStreams instance URL first', true); return; }

  const result = document.getElementById('aioResult'), btn = document.getElementById('btnAio');
  const uuid = (S.instanceUuid || '').trim(), pwd = S.instancePassword;
  const hostLabel = base ? (HOST_LABELS[base] || base.replace('https://','').split('/')[0]) : null;

  const setBtnLoading = () => { btn.disabled = true; btn.innerHTML = `<span class="dot-spin"><span></span><span></span><span></span></span> Connecting…`; };
  const resetBtn = orig => { btn.disabled = false; btn.innerHTML = orig; };

  /* Auto mode — parallel host detection via Promise.any() */
  if (isAuto && pwd) {
    const origHtml = btn.innerHTML;
    setBtnLoading(); result.innerHTML = '';
    const cfg = build().config;
    try {
      const winner = await Promise.any(
        Object.values(HOST_URLS).map(host =>
          fetchWithTimeout(`${host}/api/v1/user`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ config:cfg, password:pwd }) }, 5000)
            .then(async res => {
              const data = await res.json().catch(()=>({}));
              if (res.ok && data?.success !== false) return { host, uuid: data?.uuid || data?.user?.uuid || data?.id };
              throw new Error('rejected');
            })
        )
      );
      if (winner.uuid) { S.instanceUuid = winner.uuid; saveState(); }
      resetBtn(origHtml);
      showManifestModal(`${winner.host}/stremio/${winner.uuid}/${encodeURIComponent(pwd)}/manifest.json`, pwd, HOST_LABELS[winner.host] || winner.host.replace('https://','').split('/')[0]);
    } catch(e) {
      resetBtn(origHtml);
      result.innerHTML = `<div class="import-success" style="border-color:#4b1a1a;background:#1a0606;margin-top:12px"><strong style="color:#f87171">All Hosts Unreachable</strong><div style="color:#6b7280;font-size:.8rem;margin:6px 0 10px">CORS blocked requests or all hosts timed out. Use <strong style="color:#8b949e">Create Import URL</strong> or <strong style="color:#8b949e">Download</strong> instead.</div></div>`;
    }
    return;
  }

  /* Known host + UUID — show manifest URL directly, no API call */
  if (uuid && !isAuto) {
    const manifestUrl = pwd ? `${base}/stremio/${uuid}/${encodeURIComponent(pwd)}/manifest.json` : `${base}/stremio/${uuid}/manifest.json`;
    showManifestModal(manifestUrl, pwd || null, hostLabel);
    return;
  }

  /* No UUID, not auto or custom — guide to get UUID */
  if (!uuid && !isCustom && !isAuto) {
    result.innerHTML = `<div class="import-success" style="border-color:#374151;background:#111827;margin-top:12px"><strong style="color:#e6edf3">No UUID entered</strong><div style="color:#6b7280;font-size:.8rem;margin:6px 0 2px">Sign in to your AIOStreams instance, copy your UUID from the configure page and paste it above.</div><div style="color:#4b5563;font-size:.77rem;margin:6px 0 4px">Or use <strong style="color:#8b949e">Create Import URL</strong> above — click a chip below to open AIOStreams and import in one click:</div>${instanceChips()}</div>`;
    return;
  }

  /* Known host + password + no UUID — create new config via API */
  if (pwd) {
    const origHtml = btn.innerHTML;
    setBtnLoading(); result.innerHTML = '';
    try {
      const res = await fetchWithTimeout(uuid ? `${base}/api/v1/user/${uuid}` : `${base}/api/v1/user`, { method: uuid ? 'PATCH' : 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ config: build().config, password: pwd }) });
      const data = await res.json().catch(()=>({}));
      if (res.ok && data?.success !== false) {
        const outUuid = uuid || data?.uuid || data?.user?.uuid || data?.id;
        if (outUuid && !uuid) { S.instanceUuid = outUuid; saveState(); }
        resetBtn(origHtml);
        showManifestModal(`${base}/stremio/${outUuid}/${encodeURIComponent(pwd)}/manifest.json`, pwd, hostLabel);
      } else throw new Error('API Error');
    } catch(e) {
      resetBtn(origHtml);
      result.innerHTML = `<div class="import-success" style="border-color:#4b1a1a;background:#1a0606;margin-top:12px"><strong style="color:#f87171">Connection Failed</strong><div style="color:#6b7280;font-size:.8rem;margin:6px 0 10px">The API blocked the request (CORS) or timed out. Use Create Import URL or Download instead.</div></div>`;
    }
    return;
  }

  result.innerHTML = `<div class="import-success" style="border-color:#374151;background:#111827;margin-top:12px"><strong style="color:#e6edf3">Enter a password to proceed</strong><div style="color:#6b7280;font-size:.8rem;margin:6px 0 4px">Set a password above to generate or save your config. Or use <strong style="color:#8b949e">Create Import URL</strong> above.</div></div>`;
}
</script>

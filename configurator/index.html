<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Builds — Template Configurator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.wrap{width:100%;max-width:700px}
.hdr{text-align:center;margin-bottom:28px}
.hdr-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.hdr-logo img{width:40px;height:40px;filter:drop-shadow(0 0 8px rgba(124,58,237,.5))}
.hdr h1{font-size:1.9rem;font-weight:800;letter-spacing:-0.02em;color:#fff}
.hdr h1 span{background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:#8b949e;margin-top:6px;font-size:.95rem}
.prog-wrap{margin:20px 0 6px}
.prog-track{background:#21262d;border-radius:4px;height:6px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,#7c3aed,#a855f7);height:100%;transition:width .35s ease;border-radius:4px}
.prog-label{color:#8b949e;font-size:.78rem;text-align:right;margin-top:5px;letter-spacing:.03em}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:28px;margin-bottom:14px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card h2{font-size:1.15rem;font-weight:700;margin-bottom:5px}
.card .desc{color:#8b949e;font-size:.88rem;margin-bottom:20px;line-height:1.5}
.opts{display:grid;gap:10px}
.opts.c2{grid-template-columns:1fr 1fr}
.opts.c3{grid-template-columns:1fr 1fr 1fr}
.opts.c1{grid-template-columns:1fr}
.opt input{display:none}
.opt label{display:flex;flex-direction:column;background:#0d1117;border:2px solid #30363d;border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s;height:100%;user-select:none}
.opt input:checked+label{border-color:#7c3aed;background:#110d2a}
.opt label:hover{border-color:#584090}
.opt-icon{font-size:1.4rem;margin-bottom:7px}
.opt-name{font-weight:700;font-size:.93rem}
.opt-desc{color:#8b949e;font-size:.8rem;margin-top:4px;line-height:1.45}
.name-row label{color:#8b949e;font-size:.82rem;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.name-input{width:100%;background:#0d1117;border:2px solid #30363d;border-radius:8px;color:#e6edf3;padding:12px 16px;font-size:1rem;transition:border-color .15s;outline:none}
.name-input:focus{border-color:#7c3aed}
.name-input::placeholder{color:#484f58}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.sum-item{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px}
.sum-lbl{color:#8b949e;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.sum-val{font-weight:700;font-size:.9rem;margin-top:3px;color:#e6edf3}
.nav{display:flex;gap:12px;margin-top:6px}
.btn{padding:12px 28px;border-radius:9px;border:none;font-size:.97rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:hover{opacity:.86}
.btn-back{background:#21262d;color:#e6edf3;flex-shrink:0}
.btn-next{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;flex:1}
.btn-next:disabled{opacity:.38;cursor:not-allowed}
.btn-dl{width:100%;padding:16px;font-size:1.08rem;font-weight:800;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#059669,#10b981);color:#fff;margin-top:16px;transition:opacity .15s,transform .1s}
.btn-dl:active{transform:scale(.98)}
.btn-dl:hover{opacity:.9}
.notice{background:#0d2317;border:1px solid #2ea043;border-radius:9px;padding:13px 16px;font-size:.83rem;color:#8b949e;margin-top:14px;line-height:1.5}
.notice strong{color:#3fb950;display:block;margin-bottom:3px}
.tag{display:inline-block;background:#1f2937;border:1px solid #374151;border-radius:5px;padding:2px 8px;font-size:.75rem;color:#9ca3af;margin-top:6px;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="hdr-logo">
      <img src="https://raw.githubusercontent.com/brevityA/Core-Builds/refs/heads/main/Assets/core_icon.svg" alt="Core Builds">
      <h1><span>Core Builds</span></h1>
    </div>
    <p>Template Configurator — generate a custom AIOStreams template</p>
    <div class="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
      <div class="prog-label" id="pLabel">Step 1 of 6</div>
    </div>
  </header>
  <div id="main"></div>
  <div class="nav" id="nav">
    <button class="btn btn-back" id="btnBack" onclick="back()">← Back</button>
    <button class="btn btn-next" id="btnNext" onclick="next()">Next →</button>
  </div>
</div>
<script>
const STEPS = 6;
let step = 1;
const S = { service:null, device:null, resolution:null, audio:null, content:null, name:'' };

const DEFS = [
  { id:'service', title:'Debrid Service', desc:'Which service are you using for cached streams?', key:'service', cols:'c2',
    opts:[
      { v:'torbox-pro',   icon:'🟣', name:'TorBox Pro',          desc:'Full scraper stack — Meteor, Comet, MediaFusion, HdHub plus TorBox cache' },
      { v:'torbox-ess',   icon:'🔵', name:'TorBox Essential',     desc:'Same scraper stack on Essential plan' },
      { v:'alldebrid',    icon:'🟡', name:'AllDebrid',            desc:'AllDebrid cache via StremThru Store' },
      { v:'hybrid',       icon:'🔄', name:'Hybrid (TorBox + RD)', desc:'TorBox Pro primary plus Real-Debrid fallback' },
    ]
  },
  { id:'device', title:'Your Device', desc:'Sets audio format limits, codec exclusions, and HDR/DV handling.', key:'device', cols:'c2',
    opts:[
      { v:'generic',         icon:'📺', name:'Standard TV / Streaming Box',    desc:'No device restrictions applied — broadest compatibility' },
      { v:'samsung',         icon:'🔵', name:'Samsung TV (Tizen)',              desc:'DV-Only Kill on · AV1, VC-1 excluded · TrueHD, DTS-HD MA excluded · HDR10+ preferred' },
      { v:'appletv-old',     icon:'🍎', name:'Apple TV 4K (1st / 2nd gen)',     desc:'DV prioritised · AV1 excluded (no hardware decoder) · TrueHD + Atmos passthrough · 7.1' },
      { v:'appletv-new',     icon:'🍏', name:'Apple TV 4K (3rd gen / A15)',     desc:'DV prioritised · AV1 via software · TrueHD + Atmos passthrough · 7.1' },
      { v:'lgtv',            icon:'🟢', name:'LG TV (webOS 2019+)',             desc:'DV native · AV1 hardware decode · TrueHD + DTS-HD MA via eARC · 7.1' },
      { v:'windows',         icon:'🖥️', name:'Windows PC / Ultrawide',         desc:'Full lossless audio · AV1 + HEVC preferred · HDR-first · 7.1' },
      { v:'firestick-hd',    icon:'🔥', name:'Fire Stick (HD)',                 desc:'DV-Only Kill on · AV1 + VC-1 excluded · TrueHD, DTS-HD MA excluded · HDR10/HLG only' },
      { v:'firestick-4kmax', icon:'🔶', name:'Fire Stick 4K Max',               desc:'DV supported · AV1 hardware decode · VC-1 excluded · TrueHD, DTS-HD MA excluded' },
    ]
  },
  { id:'resolution', title:'Resolution', desc:'Primary resolution target for this template.', key:'resolution', cols:'c1',
    opts:[
      { v:'4k',        icon:'🟣', name:'4K HDR primary',              desc:'2160p streams preferred. 1080p shown as fallback. Best for 4K OLED/QLED displays.' },
      { v:'1080p',     icon:'🔵', name:'1080p only',                  desc:'Hard resolution lock — 2160p streams excluded entirely. Best for budget devices or limited bandwidth.' },
      { v:'ultrawide', icon:'🖥️', name:'1080p-first with 4K fallback', desc:'1080p quality tiers first, then 1440p, then full 4K. Ideal for ultrawide monitors or displays that upscale well.' },
    ]
  },
  { id:'audio', title:'Audio', desc:'What formats does your audio setup support?', key:'audio', cols:'c1',
    opts:[
      { v:'lossless', icon:'🎛️', name:'Full lossless (TrueHD / Atmos / DTS-HD MA / FLAC)', desc:'You have an AV receiver or soundbar with HDMI eARC. No audio tag exclusions — all lossless formats unlocked. 7.1 surround preferred.' },
      { v:'standard', icon:'🎵', name:'DD+ / Atmos (standard)',                             desc:'Soundbar or smart TV. Dolby Digital Plus and Atmos supported, no lossless decoding required.' },
      { v:'limited',  icon:'🔊', name:'Device-managed (auto)',                              desc:'Let the device profile decide. Samsung TV automatically excludes TrueHD, DTS-HD MA, DTS:X and FLAC.' },
    ]
  },
  { id:'content', title:'Content Type', desc:'What will you primarily watch?', key:'content', cols:'c1',
    opts:[
      { v:'live',  icon:'🎬',    name:'Live-action only',         desc:'Standard movies and TV. No anime scrapers. SeaDex disabled.' },
      { v:'mixed', icon:'🎌+🎬', name:'Live-action + Anime',      desc:'SeaDex enabled alongside standard scrapers. Best-release SeaDex picks for anime titles.' },
      { v:'anime', icon:'🎌',    name:'Anime-focused',            desc:'SeaDex enabled and Best-Only mode active — only the confirmed best release per anime.' },
    ]
  },
  { id:'review', title:'Review & Download', desc:'Confirm your settings and generate the template JSON.', key:null, cols:'c2', opts:[] }
];

function label(key, val) {
  const d = DEFS.find(x => x.key === key);
  if (!d) return val || '';
  const o = d.opts.find(x => x.v === val);
  return o ? o.name : val || '';
}

function renderProgress() {
  const pct = ((step - 1) / (STEPS - 1)) * 100;
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pLabel').textContent = `Step ${step} of ${STEPS}`;
}

function render() {
  renderProgress();
  const main = document.getElementById('main');
  const nav  = document.getElementById('nav');
  const def  = DEFS[step - 1];

  if (step < STEPS) {
    main.innerHTML = `
      <div class="card">
        <h2>${def.title}</h2>
        <p class="desc">${def.desc}</p>
        <div class="opts ${def.cols}">
          ${def.opts.map(o => `
            <div class="opt">
              <input type="radio" name="${def.id}" id="o_${o.v}" value="${o.v}"
                ${S[def.key] === o.v ? 'checked' : ''}
                onchange="S['${def.key}']=this.value;syncNext()">
              <label for="o_${o.v}">
                <div class="opt-icon">${o.icon}</div>
                <div class="opt-name">${o.name}</div>
                <div class="opt-desc">${o.desc}</div>
              </label>
            </div>`).join('')}
        </div>
      </div>`;
    nav.style.display = 'flex';
    document.getElementById('btnBack').style.visibility = step > 1 ? 'visible' : 'hidden';
    syncNext();
  } else {
    const auto = defaultName();
    main.innerHTML = `
      <div class="card">
        <h2>Your Configuration</h2>
        <p class="desc">Review your choices, optionally name your template, then download.</p>
        <div class="summary">
          ${['service','device','resolution','audio','content'].map(k => `
            <div class="sum-item">
              <div class="sum-lbl">${k}</div>
              <div class="sum-val">${label(k, S[k])}</div>
            </div>`).join('')}
        </div>
        <div class="name-row">
          <label>Template name (optional)</label>
          <input class="name-input" id="nameIn" type="text" placeholder="${auto}"
            value="${S.name}" oninput="S.name=this.value" maxlength="60">
        </div>
        <button class="btn-dl" onclick="generate()">⬇ Generate &amp; Download Template</button>
        <div class="notice">
          <strong>How to import</strong>
          AIOStreams → Templates → Import → paste the raw file URL, or upload the JSON file directly.<br>
          Enter your service credentials after import — this template leaves credentials blank.
        </div>
      </div>`;
    nav.style.display = 'none';
  }
}

function syncNext() {
  const def = DEFS[step - 1];
  const btn = document.getElementById('btnNext');
  const ok  = !def.key || !!S[def.key];
  btn.disabled = !ok;
}

function next() {
  if (DEFS[step-1].key && !S[DEFS[step-1].key]) return;
  if (step < STEPS) { step++; render(); window.scrollTo(0,0); }
}

function back() {
  if (step > 1) { step--; render(); window.scrollTo(0,0); }
}

// ─── Template generation ─────────────────────────────────────────────────────

function ruid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
function sid() { return Math.random().toString(36).substring(2,8); }

function defaultName() {
  const svc = {
    'torbox-pro':'TorBox Pro','torbox-ess':'TorBox Essential',
    'alldebrid':'AllDebrid','hybrid':'Hybrid'
  }[S.service] || '';
  const res = {'4k':'4K','1080p':'1080p','ultrawide':'Ultrawide'}[S.resolution] || '';
  return `Core Nexus Custom ${svc} ${res}`.trim();
}

function presets() {
  const useStore   = S.service === 'alldebrid';
  const hasSeaDex  = S.content !== 'live';

  const lib = {
    type:'library', instanceId:'lib-1', enabled:true,
    options:{ name:'Library', timeout:3000, resources:['stream','catalog','meta'],
      mediaTypes:[], showRefreshActions:['catalog'], skipProcessing:false,
      hideStreams:false, useMultipleInstances:false }
  };
  const zilean = {
    type:'zilean', instanceId:'nx-fix-04', enabled:true,
    options:{ name:'Zilean', timeout:4000, resources:['stream'] }, resources:['stream']
  };
  const seadex = {
    type:'seadex', instanceId:'tam-seadex', enabled:hasSeaDex,
    options:{ name:'SeaDex', timeout:4000, mediaTypes:['anime'] }, resources:['stream']
  };
  const torz = {
    type:'stremthruTorz', instanceId:'67c', enabled:true,
    options:{ name:'StremThru Torz', timeout:5000, includeP2P:false, useMultipleInstances:false },
    resources:['stream']
  };
  const store = {
    type:'stremthruStore', instanceId:'68a', enabled:true,
    options:{ name:'StremThru AllDebrid', timeout:5000, useMultipleInstances:false },
    resources:['stream']
  };
  const meteor = {
    type:'meteor', instanceId:'nx-fix-02', enabled:true,
    options:{ name:'Meteor', timeout:6000,
      yourMedia:{ sources:['torrent','webdl','usenet'], showStreams:true, enabled:true },
      usenet:{ enabled:true, customSearchEngines:true },
      url:'https://meteorfortheweebs.midnightignite.me', resources:['stream'] },
    resources:['stream']
  };
  const comet = {
    type:'comet', instanceId:'nx-fix-01', enabled:true,
    options:{ name:'Comet RD', timeout:7000, resources:['stream'],
      mediaTypes:['movie','series','anime'], scrapeDebridAccountTorrents:true },
    resources:['stream']
  };
  const mf = {
    type:'mediafusion', instanceId:ruid(), enabled:true,
    options:{ name:'MediaFusion', timeout:7000, resources:['stream'],
      mediaTypes:['movie','series','anime'] },
    resources:['stream']
  };
  const hdhub = {
    type:'hdhub', instanceId:'hdhub-1', enabled:!useStore,
    options:{ name:'HdHub', timeout:5000, resources:['stream'],
      mediaTypes:['movie','series','anime'], tb_only:true }
  };
  const eztv = {
    type:'eztv', instanceId:ruid(), enabled:true,
    options:{ name:'EZTV', timeout:5000 }, resources:['stream']
  };
  const tg = {
    type:'torrent-galaxy', instanceId:ruid(), enabled:true,
    options:{ name:'Torrent Galaxy', timeout:5000 }, resources:['stream']
  };
  const knaben = {
    type:'knaben', instanceId:'tam-knaben', enabled:true,
    options:{ name:'Knaben', timeout:6000, mediaTypes:[], useMultipleInstances:false },
    resources:['stream']
  };
  const tdb = {
    type:'torrents-db', instanceId:'nx-tdb-1', enabled:true,
    options:{ name:'TorrentsDB', timeout:5000, useMultipleInstances:false },
    resources:['stream']
  };
  const sub = {
    type:'aiosubtitle', instanceId:'aio-sub-1', enabled:true,
    options:{ name:'AIOSubtitle', timeout:4000, languages:['en'] }
  };
  const tbSearch = {
    type:'torbox-search', instanceId:'5f6', enabled:false,
    options:{ name:'TorBox Search', timeout:4000, sources:['torrent','usenet'],
      mediaTypes:[], userSearchEngines:false, onlyShowUserSearchResults:false,
      useMultipleInstances:false }
  };

  const list = [lib, zilean, seadex, useStore?store:torz, meteor, comet, mf, hdhub, eztv, tg, knaben, tdb, sub];
  if (!useStore) list.push(tbSearch);
  return list;
}

function services() {
  return [
    {id:'realdebrid',  enabled:false, credentials:{}},
    {id:'alldebrid',   enabled:false, credentials:{}},
    {id:'premiumize',  enabled:false, credentials:{}},
    {id:'debridlink',  enabled:false, credentials:{}},
    {id:'torbox',      enabled:true,  credentials:{}},
    {id:'offcloud',    enabled:false, credentials:{}},
    {id:'putio',       enabled:false, credentials:{}},
    {id:'easynews',    enabled:false, credentials:{}},
    {id:'easydebrid',  enabled:false, credentials:{}},
    {id:'pikpak',      enabled:false, credentials:{}},
    {id:'seedr',       enabled:false, credentials:{}},
    {id:'debrider',    enabled:false, credentials:{}}
  ];
}

function resolutionCfg() {
  if (S.resolution === '4k') return {
    excludedResolutions:['144p','240p','360p'],
    includedResolutions:[],
    requiredResolutions:[],
    preferredResolutions:['2160p','1080p','720p','Unknown'],
    maxResults:20, maxResultsPerResolution:8
  };
  if (S.resolution === '1080p') return {
    excludedResolutions:['144p','240p','360p'],
    includedResolutions:[],
    requiredResolutions:['1080p','720p'],
    preferredResolutions:['1080p','720p','Unknown'],
    maxResults:25, maxResultsPerResolution:10
  };
  return { // ultrawide
    excludedResolutions:['144p','240p','360p'],
    includedResolutions:[],
    requiredResolutions:[],
    preferredResolutions:['1080p','1440p','2160p','720p','576p','480p','Unknown'],
    maxResults:25, maxResultsPerResolution:10
  };
}

function encodeCfg() {
  const dev = S.device;
  if (dev==='samsung'||dev==='firestick-hd')  return { excludedEncodes:['AV1','VC-1'], preferredEncodes:['HEVC','AVC','Unknown'] };
  if (dev==='firestick-4kmax')                return { excludedEncodes:['VC-1'],        preferredEncodes:['HEVC','AV1','AVC','Unknown'] };
  if (dev==='appletv-old')                    return { excludedEncodes:['AV1'],          preferredEncodes:['HEVC','AVC','Unknown'] };
  if (dev==='appletv-new'||dev==='lgtv')      return { excludedEncodes:[],               preferredEncodes:['HEVC','AV1','AVC','Unknown'] };
  if (dev==='windows')                        return { excludedEncodes:['VC-1'],          preferredEncodes:['HEVC','AV1','AVC','Unknown'] };
  return                                             { excludedEncodes:[],               preferredEncodes:['HEVC','AV1','AVC','Unknown'] };
}

function audioCfg() {
  const dev     = S.device;
  const limited = S.audio==='limited' || dev==='samsung' || dev==='firestick-hd' || dev==='firestick-4kmax';
  const lossless= S.audio==='lossless';
  const wide    = dev==='windows' || dev==='lgtv' || dev==='appletv-old' || dev==='appletv-new' || lossless;
  return {
    excludedAudioTags: limited ? ['TrueHD','DTS-HD MA','DTS:X','FLAC'] : [],
    preferredAudioTags:['TrueHD','Atmos','DTS-HD MA','DTS:X','FLAC','EAC3','DD+','AAC','DTS','AC3'],
    preferredAudioChannels: wide ? ['7.1','5.1','2.0'] : ['5.1','2.0']
  };
}

function visualTags() {
  const dev = S.device;
  if (dev==='appletv-old'||dev==='appletv-new') return ['DV','HDR+DV','HDR10+','HDR10','HDR','HLG','10bit','SDR','IMAX'];
  if (dev==='lgtv')          return ['DV','HDR+DV','HDR10+','HDR10','HDR','HLG','10bit','SDR','IMAX'];
  if (dev==='samsung')       return ['HDR10+','HDR10','HDR','HLG','10bit','SDR','IMAX'];
  if (dev==='firestick-hd')  return ['HDR10','HDR','HLG','SDR'];
  if (dev==='firestick-4kmax') return ['DV','HDR10+','HDR10','HDR','HLG','10bit','SDR','IMAX'];
  if (dev==='windows')       return ['HDR+DV','DV','HDR10+','HDR10','HDR','HLG','10bit','SDR','IMAX'];
  // generic
  if (S.resolution==='4k') return ['HDR+DV','DV','HDR10+','HDR10','HDR','HLG','10bit','SDR','IMAX'];
  return ['HDR10','HDR','HLG','10bit','SDR','IMAX'];
}

function eses() {
  const out = [];
  const dev  = S.device;
  const is1080= S.resolution === '1080p';

  // Flood Guard
  out.push({ enabled:true, expression:
    "/*Per-Addon Flood Guard*/ merge(" +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'Meteor'),5)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'Comet RD'),5)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'MediaFusion'),4)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'Torrent Galaxy'),1)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'EZTV'),3)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'Knaben'),1)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'HdHub'),3)," +
    "slice(addon(negate(merge(library(streams),seadex(streams)),cached(streams)),'TorrentsDB'),1))"
  });

  // Bad Dual Audio Groups (live-action or mixed)
  if (S.content !== 'anime') {
    out.push({ enabled:true, expression:
      "/* Bad Dual Audio Groups */ releaseGroup(streams,'alfaHD','BAT','BiOMA','BlackBit','BNd','Cory','EXTREME','FF','FOXX','G4RiS','GUEIRA','LCD','N3G4N','PD','PTHome','RiPER','RK','SiGLA','Tars','TM','tokar86a','TURG','vnlls','WTV','Yatogam1','YusukeFLA','ZigZag','ZNM')"
    });
  }

  // Usenet Propagation Guard
  out.push({ enabled:true, expression:
    "/*Usenet Propagation Guard*/ count(negate(age(type(streams,'usenet','stremio-usenet'),0,'0.083'),type(streams,'usenet','stremio-usenet')))>0?age(type(streams,'usenet','stremio-usenet'),0,'0.083'):[]"
  });

  // YouTube Kill
  out.push({ enabled:true, expression:"/* CB | Hard YouTube Kill */ type(streams,'youtube','external')" });

  // 3D Content Kill
  out.push({ enabled:true, expression:"/* CB | 3D Content Kill */ visualTag(streams,'3D','H-OU','H-SBS')" });

  // Season Pack Kill
  out.push({ enabled:true, expression:"/* CB | Kill Season Packs When Episodes Exist */ count(negate(streams,seasonPack(streams)))>=10?seasonPack(streams):[]" });

  // Hard Resolution Kill (1080p only)
  if (is1080) {
    out.push({ enabled:true, expression:"/* Hard Resolution Kill */ resolution(streams,'2160p','1440p')" });
  }

  // DV-Only Kill (Samsung / Fire Stick HD — devices with no DV support)
  if (dev==='samsung'||dev==='firestick-hd') {
    out.push({ enabled:true, expression:
      "/* DV-Only Kill */ negate(visualTag(streams,'DV'),merge(visualTag(streams,'HDR10+'),visualTag(streams,'HDR10'),visualTag(streams,'HDR'),visualTag(streams,'HLG'),visualTag(streams,'SDR')))"
    });
  }

  // Extra Cached HQ
  out.push({ enabled:true, expression:
    "/* Extra Cached HQ */ negate(perGroup(negate(merge(library(streams),uncached(streams)),quality(streams,'BluRay REMUX','BluRay','WEB-DL','WEBRip')),'resolution',3),negate(merge(library(streams),uncached(streams)),quality(streams,'BluRay REMUX','BluRay','WEB-DL','WEBRip')))"
  });

  // Extra Cached LQ
  out.push({ enabled:true, expression:
    "/* Extra Cached LQ */ negate(perGroup(negate(merge(library(streams),uncached(streams)),quality(streams,'HDTV','HDRip','DVDRip','HC HD-Rip','TC','SCR','CAM','TS','Unknown')),'resolution',3),negate(merge(library(streams),uncached(streams)),quality(streams,'HDTV','HDRip','DVDRip','HC HD-Rip','TC','SCR','CAM','TS','Unknown')))"
  });

  // Extra Uncached
  out.push({ enabled:true, expression:
    "/* Extra Uncached */ negate(perGroup(uncached(streams),'resolution',3),uncached(streams))"
  });

  return out;
}

function pses() {
  const out  = [];
  const res  = S.resolution;
  const dev  = S.device;
  const dv   = dev==='appletv-old' || dev==='appletv-new' || dev==='lgtv' || dev==='firestick-4kmax';

  const pin4kElite   = { enabled:true, expression:"/* Elite 4K REMUX Pin */ pin(releaseGroup(quality(resolution(streams,'BluRay REMUX'),'2160p'),'FraMeSToR','DON','FLUX','HIFI','playBD','BMF','QxR','EPSiLON','BLURANiUM','PmP'),'top')" };
  const pin1080Elite = { enabled:true, expression:"/* Elite 1080p REMUX Pin */ pin(releaseGroup(quality(resolution(streams,'BluRay REMUX'),'1080p'),'NTb','FLUX','KiNGS','NTG','BHDStudio','FraMeSToR','SiC','126811'),'top')" };
  const pinLQ        = { enabled:true, expression:"/* LQ Pin Bottom */ pin(releaseGroup(streams,'YIFY','RARBG','EVO','YTS','PSA','MeGusta','Tigole'),'bottom')" };

  if (res === '4k') {
    out.push(pin4kElite, pin1080Elite, pinLQ);
    if (dv) out.push({ enabled:true, expression:"/* S-Tier 4K REMUX DV */ visualTag(quality(resolution(streams,'2160p'),'BluRay REMUX'),'DV','HDR+DV')" });
    out.push(
      { enabled:true, expression:"/* S-Tier 4K BluRay REMUX */ quality(resolution(streams,'2160p'),'BluRay REMUX')" },
      { enabled:true, expression:"/* A-Tier 4K WEB-DL HDR */ visualTag(quality(resolution(streams,'2160p'),'WEB-DL'),'DV','HDR+DV','HDR10+','HDR10','HDR')" },
      { enabled:true, expression:"/* B-Tier 4K WEB-DL */ quality(resolution(streams,'2160p'),'WEB-DL')" },
      { enabled:true, expression:"/* C-Tier Any 4K */ resolution(streams,'2160p')" },
      { enabled:true, expression:"/* S-Tier 1080p BluRay REMUX */ quality(resolution(streams,'1080p'),'BluRay REMUX')" },
      { enabled:true, expression:"/* A-Tier 1080p WEB-DL */ quality(resolution(streams,'1080p'),'WEB-DL')" },
      { enabled:true, expression:"/* B-Tier 1080p WEBRip or BluRay */ quality(resolution(streams,'1080p'),'WEBRip','BluRay')" },
      { enabled:true, expression:"/* C-Tier Any 1080p */ resolution(streams,'1080p')" },
      { enabled:true, expression:"/* Codec Efficiency Booster */ encode(streams,'HEVC','AV1')" },
      { enabled:true, expression:"/* Audio Pinnacle */ audioTag(streams,'TrueHD','Atmos','DTS-HD MA','DTS:X','FLAC')" },
      { enabled:true, expression:"/* HDR Priority */ visualTag(streams,'HDR+DV','DV','HDR10+','HDR10','HDR')" },
      { enabled:true, expression:"/* Boost Cached Usenet */ type(cached(streams),'usenet','stremio-usenet')" }
    );

  } else if (res === '1080p') {
    out.push(pin1080Elite, pinLQ);
    out.push(
      { enabled:true, expression:"/* S-Tier 1080p BluRay REMUX */ quality(resolution(streams,'1080p'),'BluRay REMUX')" },
      { enabled:true, expression:"/* A-Tier 1080p WEB-DL */ quality(resolution(streams,'1080p'),'WEB-DL')" },
      { enabled:true, expression:"/* B-Tier 1080p WEBRip or BluRay */ quality(resolution(streams,'1080p'),'WEBRip','BluRay')" },
      { enabled:true, expression:"/* C-Tier Any 1080p */ resolution(streams,'1080p')" },
      { enabled:true, expression:"/* 720p WEB-DL Fallback */ quality(resolution(streams,'720p'),'WEB-DL','WEBRip')" },
      { enabled:true, expression:"/* 720p Any Fallback */ resolution(streams,'720p')" },
      { enabled:true, expression:"/* Codec Efficiency Booster */ encode(streams,'HEVC','AV1')" },
      { enabled:true, expression:"/* Boost Cached Usenet */ type(cached(streams),'usenet','stremio-usenet')" }
    );

  } else { // ultrawide
    out.push(pin1080Elite, pinLQ);
    out.push(
      { enabled:true, expression:"/* S-Tier 1080p BluRay REMUX */ quality(resolution(streams,'1080p'),'BluRay REMUX')" },
      { enabled:true, expression:"/* A-Tier 1080p WEB-DL */ quality(resolution(streams,'1080p'),'WEB-DL')" },
      { enabled:true, expression:"/* B-Tier 1080p WEBRip or BluRay */ quality(resolution(streams,'1080p'),'WEBRip','BluRay')" },
      { enabled:true, expression:"/* C-Tier Any 1080p */ resolution(streams,'1080p')" },
      { enabled:true, expression:"/* 1440p Any Quality */ quality(resolution(streams,'1440p'),'BluRay REMUX','BluRay','WEB-DL','WEBRip')" },
      { enabled:true, expression:"/* 4K Fallback BluRay REMUX */ quality(resolution(streams,'2160p'),'BluRay REMUX')" },
      { enabled:true, expression:"/* 4K Fallback WEB-DL HDR */ visualTag(quality(resolution(streams,'2160p'),'WEB-DL'),'DV','HDR+DV','HDR10+','HDR10','HDR')" },
      { enabled:true, expression:"/* 4K Fallback Any */ resolution(streams,'2160p')" },
      { enabled:true, expression:"/* 720p WEB-DL Fallback */ quality(resolution(streams,'720p'),'WEB-DL','WEBRip')" },
      { enabled:true, expression:"/* 720p Any Fallback */ resolution(streams,'720p')" },
      { enabled:true, expression:"/* Codec Efficiency Booster */ encode(streams,'HEVC','AV1')" },
      { enabled:true, expression:"/* Audio Pinnacle */ audioTag(streams,'TrueHD','Atmos','DTS-HD MA','DTS:X','FLAC')" },
      { enabled:true, expression:"/* HDR Priority */ visualTag(streams,'HDR+DV','DV','HDR10+','HDR10','HDR')" },
      { enabled:true, expression:"/* Boost Cached Usenet */ type(cached(streams),'usenet','stremio-usenet')" }
    );
  }

  return out;
}

function daf() {
  if (S.resolution === '4k') return { enabled:true, condition:"count(cached(resolution(totalStreams,'2160p')))>=5 or totalTimeTaken>5000" };
  return { enabled:true, condition:"count(cached(resolution(totalStreams,'1080p')))>=15 or totalTimeTaken>5000" };
}

function groups() {
  if (S.service === 'torbox-pro' || S.service === 'hybrid') {
    return { enabled:true, groupings:[{ addons:['nx-fix-02','nx-fix-01'], condition:"count(cached(previousStreams))<3" }] };
  }
  return { enabled:false, groupings:[] };
}

function sortCriteria() {
  const ord = [
    {key:'cached',direction:'desc'},{key:'streamExpressionMatched',direction:'desc'},
    {key:'streamExpressionScore',direction:'desc'},{key:'library',direction:'desc'},
    {key:'resolution',direction:'desc'},{key:'quality',direction:'desc'},
    {key:'regexScore',direction:'desc'},{key:'visualTag',direction:'desc'},
    {key:'encode',direction:'desc'},{key:'audioTag',direction:'desc'},
    {key:'audioChannel',direction:'desc'},{key:'language',direction:'desc'},
    {key:'seeders',direction:'desc'},{key:'size',direction:'desc'}
  ];
  return { global:ord, movies:ord, series:ord, anime:ord };
}

function deduplicator() {
  return {
    enabled:true, excludeAddons:[], multiGroupBehaviour:'aggressive',
    keys:['filename','infoHash','smartDetect'],
    cached:'single_result', uncached:'per_service', p2p:'per_addon',
    smartDetectAttributes:['size','resolution','quality','visualTags','audioTags','audioChannels','languages','encode','edition','network','remastered','bitrate','releaseGroup'],
    smartDetectRounding:10, libraryBehaviour:'prefer',
    tiebreakers:[{type:'torrent_seeders',position:'before_addon'},{type:'usenet_age',position:'before_addon'}]
  };
}

function formatter() {
  return {
    id:'tamtaro',
    definitions:{
      overrides:{
        tamtaro:{
          name:"{stream.resolution::exists[\"{stream.resolution::replace('2160p','🟣 4K')::replace('1440p','🟡 2K')::replace('1080p','🔵 1080P')::replace('720p','🟢 720P')::replace('480p','⚫ 480P')::replace('360p','⚫ 360P')}  \"||\"📺 HD  \"]}{service.shortName::exists[\"⚡ {service.shortName::upper}  \"||\"📡 P2P  \"]}{stream.library::istrue[\"🗄️  \"||\"\"]}{stream.proxied::istrue[\"🕵️  \"||\"\"]}{stream.visualTags::~(?i)(DV|HDR|HLG)[\"{stream.visualTags::join(' ')::replace('DV','👁️ DV')::replace('HDR10+','✨ HDR¹⁰⁺')::replace('HDR10','🌟 HDR¹⁰')::replace('HLG','🌤️ HLG')::replace('HDR','🌟 HDR')::replace('SDR','')::replace('10BIT','')::replace('10bit','')::replace('STANDARD','')}  \"||\"\"]}{stream.title::exists[\"{stream.title::upper}\"||\"\"]}{stream.formattedSeasons::exists[\" {stream.formattedSeasons::upper}\"||\"\"]}{stream.formattedEpisodes::exists[\" {stream.formattedEpisodes::upper}\"||\"\"]}",
          description:" {service.cached::istrue[\"🚀 INSTANT  \"||\"\"]}{service.cached::isfalse[\"⚠️ UNCACHED  \"||\"\"]}{stream.nSeScore::>=75[\"💎 {stream.nSeScore}  \"||\"\"]}{stream.seadexBest::istrue[\"⭐ BEST  \"||\"\"]}{stream.seadex::istrue[\"✅ SEADEX  \"||\"\"]}{stream.regexMatched::exists[\"🎯 {stream.regexMatched::truncate(12)::smallcaps}  \"||\"\"]}{stream.seMatched::exists[\"🧲 {stream.seMatched::truncate(12)::smallcaps}  \"||\"\"]}{stream.releaseGroup::exists[\"🏷️ {stream.releaseGroup::smallcaps}  \"||\"\"]}{stream.releaseGroup::~(?i)(epsilon|framestor|qxr|tigole|ntb|flux|d-z0n3|playbd|hifi|don|huno|bmf)[\"👑 PREMIER  \"||\"\"]}{stream.filename::~(?i)IMAX[\"🎞️ IMAX  \"||\"\"]}{tools.newLine} 🎬 {stream.quality::exists[\"{stream.quality::upper::replace('BLURAY REMUX','💎 REMUX')::replace('BLURAY','💿 BLURAY')::replace('BLU-RAY REMUX','💎 REMUX')::replace('BLU-RAY','💿 BLURAY')::replace('WEB-DL','🍿 WEB-DL')::replace('WEBRIP','📼 WEBRIP')::replace('HDTV','🎞️ HDTV')::replace('HDRIP','🎞️ HDRIP')}  \"||\"\"]}{stream.encode::exists[\"{stream.encode::smallcaps}  \"||\"\"]}{stream.container::exists[\"{stream.container::smallcaps}  \"||\"\"]}{stream.hasChapters::istrue[\"📖  \"||\"\"]}{stream.visualTags::exists[\"{stream.visualTags::join(' ')::replace('DV','👁️ DV')::replace('HDR10+','✨ HDR¹⁰⁺')::replace('HDR10','🌟 HDR¹⁰')::replace('HLG','🌤️ HLG')::replace('HDR','🌟 HDR')::replace('SDR','☀️ SDR')::replace('10BIT','🎨 10ʙɪᴛ')::replace('10bit','🎨 10ʙɪᴛ')::replace('STANDARD','☀️ SDR')}  \"||\"☀️ SDR  \"]}{stream.bitrate::exists[\"{stream.bitrate::sbitrate::smallcaps}  \"||\"\"]}{stream.network::exists[\"🍿 {stream.network::upper}  \"||\"\"]}{stream.upscaled::istrue[\"🔬 UPSCALED  \"||\"\"]}{stream.unrated::istrue[\"🚫 UNRATED  \"||\"\"]}{stream.uncensored::istrue[\"🔞  \"||\"\"]}{stream.editions::exists[\"✂️ {stream.editions::join(' ')::upper}  \"||\"\"]}{tools.newLine} 🎛️ {stream.audioTags::exists[\"{stream.audioTags::join(' ')::upper::replace('ATMOS','🔮 ATMOS')::replace('TRUEHD','💎 TRUEHD')::replace('DTS-HD MA','🔷 DTS-HD MA')::replace('DTS-X','🎵 DTS-X')::replace('EAC3','🎶 EAC3')::replace('DDP','🎶 DD+')::replace('DD+','🎶 DD+')::replace('AAC','🎧 AAC')::replace('FLAC','💿 FLAC')::replace('AC3','🎵 AC3')}  \"||\"ᴀᴜᴅɪᴏ  \"]}{stream.audioChannels::first::=2.0[\"🔈 \"||\"\"]}{stream.audioChannels::first::=5.1[\"🔉 \"||\"\"]}{stream.audioChannels::first::=7.1[\"🔊 \"||\"\"]}{stream.audioChannels::exists[\"{stream.audioChannels::first}  \"||\"\"]}🌍 {stream.uLanguageEmojis::exists[\"{stream.uLanguageEmojis::join(' ')}\"||\"MULTI\"]}{stream.dubbed::istrue[\"  🎙️ DUB\"||\"\"]}{stream.uSubtitleEmojis::exists[\"  📝 {stream.uSubtitleEmojis::slice(0,3)::join(' ')}\"||\"\"]}{tools.newLine} 💾 {stream.size::exists[\"{stream.size::sbytes}  \"||\"\"]}{stream.folderSize::exists[\"📦 {stream.folderSize::sbytes}  \"||\"\"]}{stream.seasonPack::istrue[\"🗂️ PACK  \"||\"\"]}{stream.repack::istrue[\"🛠️ REPACK  \"||\"\"]}{stream.seeders::exists[\"🌱 {stream.seeders}  \"||\"\"]}{stream.freeleech::istrue[\"🆓 FREE  \"||\"\"]}{stream.age::exists[\"⏱️ {stream.age::smallcaps}  \"||\"\"]}{stream.indexer::exists[\"🔍 {stream.indexer::truncate(12)::smallcaps}  \"||\"\"]}🔌 {stream.type::exists[\"{stream.type::smallcaps}\"||\"\"]}",
        }
      }
    }
  };
}

function build() {
  const name = (S.name.trim() || defaultName());
  const id   = 'core-custom-' + sid();
  const rc   = resolutionCfg();
  const ec   = encodeCfg();
  const ac   = audioCfg();
  const svcName = {
    'torbox-pro':'TorBox Pro','torbox-ess':'TorBox Essential',
    'alldebrid':'AllDebrid','hybrid':'Hybrid'
  }[S.service];
  const devName = {
    'generic':'Generic','samsung':'Samsung TV (Tizen)',
    'appletv-old':'Apple TV 4K (1st/2nd gen)','appletv-new':'Apple TV 4K (3rd gen)',
    'lgtv':'LG TV (webOS)','windows':'Windows PC',
    'firestick-hd':'Fire Stick HD','firestick-4kmax':'Fire Stick 4K Max'
  }[S.device];
  const resName = {'4k':'4K','1080p':'1080p','ultrawide':'1080p+4K'}[S.resolution];

  return {
    metadata:{
      id, name,
      description:`Custom template — ${svcName} · ${devName} · ${resName}. Generated by Core Builds Configurator.`,
      source:'external',
      author:'Branding-Brevity',
      version:'0.1.0',
      category:'Debrid',
      serviceRequired:false,
      setToSaveInstallMenu:true,
      sourceUrl:'https://github.com/brevityA/Core-Builds',
      changelogUrl:'https://raw.githubusercontent.com/brevityA/Core-Builds/refs/heads/main/CHANGELOG.md'
    },
    config:{
      trusted:false, showChanges:true,
      addonName:name,
      addonLogo:'https://raw.githubusercontent.com/brevityA/Core-Builds/refs/heads/main/Assets/core_icon.svg',
      addonDescription:`${svcName} · ${devName} · ${resName}`,
      appliedTemplates:[{id:'core-builds-configurator',version:'0.1.0'}],
      presets:presets(),
      services:services(),
      excludedResolutions:rc.excludedResolutions,
      includedResolutions:rc.includedResolutions,
      requiredResolutions:rc.requiredResolutions,
      preferredResolutions:rc.preferredResolutions,
      excludedQualities:[],
      includedQualities:[],
      requiredQualities:[],
      preferredQualities:['BluRay REMUX','BluRay','WEB-DL','WEBRip','HDRip','HC HD-Rip','DVDRip','HDTV','SCR','TC','TS','CAM','Unknown'],
      excludedLanguages:[],
      includedLanguages:['English','Original','Dual Audio','Multi','Dubbed','Unknown'],
      excludedEncodes:ec.excludedEncodes,
      preferredEncodes:ec.preferredEncodes,
      excludedAudioTags:ac.excludedAudioTags,
      preferredAudioTags:ac.preferredAudioTags,
      preferredAudioChannels:ac.preferredAudioChannels,
      preferredVisualTags:visualTags(),
      enableSeadex:S.content !== 'live',
      seadexBestOnly:S.content === 'anime',
      excludeCached:false,
      excludeCachedFromAddons:[],
      excludeCachedFromServices:[],
      excludeCachedFromStreamTypes:[],
      excludeUncached:false,
      excludeUncachedFromAddons:[],
      excludeUncachedFromServices:[],
      excludeUncachedFromStreamTypes:[],
      checkOwned:false,
      externalDownloads:false,
      autoRemoveDownloads:false,
      excludeUncachedMode:'or',
      excludedStreamSources:['YouTube','AI Enhanced'],
      syncedExcludedRegexUrls:['https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-excluded-regex.json'],
      syncedRankedRegexUrls:['https://raw.githubusercontent.com/Vidhin05/Releases-Regex/main/English/regexes.json'],
      rankedRegexPatterns:[],
      preferredRegexPatterns:[],
      excludedRegexPatterns:[],
      addonCategoryColors:{Mix:'indigo',Debrid:'emerald',Usenet:'lime',HTTP:'cyan',P2P:'orange',Subs:'purple'},
      mergedCatalogs:[],
      rpdbApiKey:'t0-free-rpdb',
      posterService:'rpdb',
      enhanceResults:true,
      tmdbAccessToken:'<template_placeholder>',
      tmdbApiKey:'<template_placeholder>',
      usePosterRedirectApi:true,
      usePosterServiceForMeta:true,
      maxResults:rc.maxResults,
      maxResultsPerResolution:rc.maxResultsPerResolution,
      excludedStreamExpressions:eses(),
      includedStreamExpressions:[],
      preferredStreamExpressions:pses(),
      sortCriteria:sortCriteria(),
      deduplicator:deduplicator(),
      dynamicAddonFetching:daf(),
      groups:groups(),
      formatter:formatter()
    }
  };
}

function generate() {
  const tmpl   = build();
  const json   = JSON.stringify(tmpl, null, 2);
  const blob   = new Blob([json], {type:'application/json'});
  const url    = URL.createObjectURL(blob);
  const a      = document.createElement('a');
  const fname  = (S.name.trim()||defaultName()).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.json';
  a.href = url; a.download = fname; a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
